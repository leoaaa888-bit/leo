        let justResumedAt = 0;
        const RESUME_GRACE_MS = 3500;
        let recoverDebounceTimer = null;
        let mediaConnectStartedAt = 0;
        let controlConnectStartedAt = 0;
        const STALL_MS = 4000;
        const PACKET_STALL_MS = 5000;
        // 解码器卡死判定：视频包还在流、但画面已 N 毫秒没更新，就重连自愈。
        // 关键帧每秒一个，4.5 秒还不出画面基本就是卡死了。WebCodecs 和 MSE 都用。
        const WEDGED_STALL_MS = 4500;
        const KEYFRAME_WAIT_MS = 2500;
        const FORCE_RECONNECT_COOLDOWN_MS = 2500;
        const KEEPALIVE_MS = 8000;
        const LATENCY_PING_MS = 2000;
        let latencyPingSentAt = 0;
        let latencyTimer = null;
        let pingLatencyMs = null;
        const HIDDEN_FORCE_MS = 4000;
        const CONNECT_TIMEOUT_MS = 8000;
        const MAX_BACKOFF_MS = 4000;
        // Liveness is judged by ping/pong: a silent media stream is NORMAL
        // while the remote screen is static (scrcpy sends nothing then).
        const HEALTH_STALL_MS = 9000;
        let lastPongAt = 0;
        let lastVideoPacketAt = 0;

        // —— Reconnect diagnostics: ring buffer of recent reconnect events so a
        // user on a phone (no dev console) can report exactly what fired. ——
        const diagLog = [];
        const DIAG_MAX = 40;
        let lastConnectedAt = 0;
        let diagReconnectTotal = 0;
        let diagSessionStart = Date.now();

        function pad2(n) { return (n < 10 ? '0' : '') + n; }
        function diagClock(d) {
            return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
        }

        function recordDiag(kind, detail) {
            const now = Date.now();
            const upMs = lastConnectedAt ? (now - lastConnectedAt) : 0;
            diagLog.unshift({
                t: diagClock(new Date(now)),
                kind: kind,
                detail: detail || '',
                up: lastConnectedAt ? Math.round(upMs / 1000) : null,
            });
            if (diagLog.length > DIAG_MAX) {
                diagLog.length = DIAG_MAX;
            }
            if (kind === 'reconnect') {
                diagReconnectTotal += 1;
            }
        }

        function kindLabel(kind) {
            return {
                'reconnect': '重连',
                'connected': '已连接',
                'media-close': '媒体断开',
                'control-close': '控制断开',
            }[kind] || kind;
        }

        function buildDiagText() {
            const runMin = Math.round((Date.now() - diagSessionStart) / 60000);
            const upNow = (lastConnectedAt && mediaConnected)
                ? Math.round((Date.now() - lastConnectedAt) / 1000) + '秒'
                : '未连接';
            const lines = [];
            lines.push('=== web-scrcpy 连接诊断 ===');
            lines.push('运行 ' + runMin + ' 分钟 | 重连 ' + diagReconnectTotal + ' 次 | 当前已连 ' + upNow);
            lines.push('画质 ' + qualityConfig.label + ' (' + qualityConfig.max_size + 'p/'
                + qualityConfig.video_bit_rate.slice(0, -6) + 'M) | 延迟 '
                + (chipLatency ? chipLatency.textContent : '--'));
            lines.push('UA ' + navigator.userAgent);
            lines.push('--- 事件（新→旧）---');
            if (!diagLog.length) {
                lines.push('（暂无记录。发生重连或断开后会显示在这里。）');
            } else {
                for (const e of diagLog) {
                    const up = e.up != null ? ('  连了' + e.up + 's') : '';
                    lines.push(e.t + '  ' + kindLabel(e.kind) + up + '  ' + e.detail);
                }
            }
            return lines.join('\n');
        }

        function renderDiagnostics() {
            const ta = document.getElementById('diag-text');
            if (ta) {
                ta.value = buildDiagText();
            }
        }

        function showDiagnostics() {
            const overlay = document.getElementById('diag-overlay');
            if (!overlay) {
                return;
            }
            renderDiagnostics();
            overlay.classList.add('is-open');
        }

        function hideDiagnostics() {
            const overlay = document.getElementById('diag-overlay');
            if (overlay) {
                overlay.classList.remove('is-open');
            }
        }

        function copyDiagnostics() {
            const ta = document.getElementById('diag-text');
            const btn = document.getElementById('diag-copy');
            if (!ta) {
                return;
            }
            const text = ta.value;
            const flash = (ok) => {
                if (!btn) {
                    return;
                }
                btn.textContent = ok ? '已复制' : '请手动全选复制';
                btn.classList.toggle('copied', ok);
                setTimeout(() => {
                    btn.textContent = '复制';
                    btn.classList.remove('copied');
                }, 1800);
            };
            // execCommand path works over plain HTTP where Clipboard API is blocked.
            let ok = false;
            try {
                ta.focus();
                ta.setSelectionRange(0, text.length);
                ok = document.execCommand('copy');
            } catch (e) {
                ok = false;
            }
            if (ok) {
                flash(true);
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => flash(true)).catch(() => flash(false));
            } else {
                flash(false);
            }
        }

        (function bindDiagnostics() {
            const overlay = document.getElementById('diag-overlay');
            const closeBtn = document.getElementById('diag-close');
            const copyBtn = document.getElementById('diag-copy');
            // touchend already fired the action + ate the gesture; skip the
            // synthetic click that follows so it doesn't run twice on iOS.
            const bindTapAction = (el, action) => {
                if (!el) return;
                let touchHandled = false;
                el.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    touchHandled = true;
                    action();
                }, { passive: false });
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (touchHandled) { touchHandled = false; return; }
                    action();
                });
            };
            bindTapAction(closeBtn, hideDiagnostics);
            bindTapAction(copyBtn, copyDiagnostics);

            // 重启手机：二次确认。第一次点 → 变红“确认重启”，4 秒内再点才真重启。
            const rebootBtn = document.getElementById('diag-reboot');
            let rebootConfirm = false;
            let rebootTimer = null;
            const resetRebootBtn = () => {
                rebootConfirm = false;
                if (rebootTimer) { clearTimeout(rebootTimer); rebootTimer = null; }
                if (rebootBtn) {
                    rebootBtn.textContent = '重启手机';
                    rebootBtn.classList.remove('confirm');
                }
            };
            const onReboot = () => {
                if (!rebootBtn) return;
                if (!rebootConfirm) {
                    rebootConfirm = true;
                    rebootBtn.textContent = '确认重启？';
                    rebootBtn.classList.add('confirm');
                    rebootTimer = setTimeout(resetRebootBtn, 4000);
                    return;
                }
                resetRebootBtn();
                rebootBtn.textContent = '重启中…';
                fetch('/api/reboot', { method: 'POST' })
                    .then((r) => r.ok ? r.json() : null)
                    .then((d) => {
                        showKeyboardHint(d && d.ok
                            ? '手机正在重启，约 1 分钟后点三下解锁进入'
                            : '重启失败，请检查连接');
                    })
                    .catch(() => showKeyboardHint('重启失败，请检查连接'))
                    .finally(() => { rebootBtn.textContent = '重启手机'; });
                hideDiagnostics();
            };
            bindTapAction(rebootBtn, onReboot);

            // 盲解锁：填入的 PIN 预置、记住开关、点“解锁”发送。
            const pinInput = document.getElementById('unlock-pin');
            const rememberBox = document.getElementById('unlock-remember');
            if (pinInput && rememberBox) {
                rememberBox.checked = loadRememberPin();
                if (rememberBox.checked) {
                    pinInput.value = loadDevicePin();
                }
                bindTapAction(document.getElementById('unlock-send'), () => {
                    const pin = (pinInput.value || '').trim();
                    if (!/^\d{4,16}$/.test(pin)) {
                        showKeyboardHint('请输入 4–16 位数字 PIN');
                        return;
                    }
                    if (rememberBox.checked) {
                        saveDevicePin(pin);
                        saveRememberPin(true);
                    } else {
                        saveDevicePin('');
                        saveRememberPin(false);
                    }
                    sendUnlock(pin);
                    hideDiagnostics();
                });
            }

            // —— 粘贴到手机 ——
            // 手机端没有本机键盘映射通路（keyboardEnabled 在移动端恒为 false），
            // 这里直接调 input.sendText()：纯 ASCII 走 INJECT_TEXT，含中文走
            // SET_CLIPBOARD + 粘贴键。它不受键盘开关影响。
            const pasteBox = document.getElementById('paste-text');
            if (pasteBox) {
                bindTapAction(document.getElementById('paste-read'), () => {
                    // http+IP 不是安全上下文，navigator.clipboard 多半不可用；
                    // 读不到就提示手动粘贴，不假装成功。
                    if (!navigator.clipboard || !navigator.clipboard.readText) {
                        showKeyboardHint('此环境读不了剪贴板，请长按输入框手动粘贴');
                        pasteBox.focus();
                        return;
                    }
                    navigator.clipboard.readText().then((t) => {
                        if (t) {
                            pasteBox.value = t;
                            showKeyboardHint('已读入剪贴板');
                        } else {
                            showKeyboardHint('剪贴板是空的');
                        }
                    }).catch(() => {
                        showKeyboardHint('读剪贴板被拒绝，请长按输入框手动粘贴');
                        pasteBox.focus();
                    });
                });

                bindTapAction(document.getElementById('paste-clear'), () => {
                    pasteBox.value = '';
                    pasteBox.focus();
                    showKeyboardHint('已清除');
                });

                bindTapAction(document.getElementById('paste-send'), () => {
                    const text = pasteBox.value || '';
                    if (!text.trim()) {
                        showKeyboardHint('先粘贴要发送的文字');
                        pasteBox.focus();
                        return;
                    }
                    if (!input) {
                        showKeyboardHint('画面未连接，无法发送');
                        return;
                    }
                    input.sendText(text);
                    showKeyboardHint('已发送到手机（需先点中手机上的输入框）');
                    hideDiagnostics();
                });
            }

            if (overlay) {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        resetRebootBtn();     // 关闭面板时复位确认态
                        hideDiagnostics();
                    }
                });
            }
        })();

        function markFramePresented() {
            lastPresentedAt = Date.now();
            reconnectAttempt = 0;
            // 新画面已出，切换画质完成，清除“安静切换”标志。
            if (quietSwitch) {
                quietSwitch = false;
                if (quietSwitchTimer) {
                    clearTimeout(quietSwitchTimer);
                    quietSwitchTimer = null;
                }
            }
            // 新一帧已经画到画布上，撤掉定格快照。
            hideFreezeFrame();
            hideScreenLoader();
            layoutDeviceFrame();
            // 手机唤醒到锁屏后只亮约 9 秒就回休眠，而视频要几秒才出画面。
            // 所以画面真正出来时再唤醒一次，保证你看到 PIN 盘时窗口是完整的。
            // 服务端对“已唤醒且未锁屏”的手机会跳过，不会打断正在进行的操作。
            if (!wakeOnFirstFrameDone) {
                wakeOnFirstFrameDone = true;
                wakeOrUnlock(true);  // 首帧兜底：静默，若已解锁则后端自动跳过
            }
        }

        function markMediaPacket() {
            lastMediaPacketAt = Date.now();
        }

        function reconnectDelayMs() {
            if (reconnectAttempt <= 1) {
                return 100;
            }
            const base = 200 * Math.pow(1.6, Math.min(reconnectAttempt - 1, 6));
            return Math.min(MAX_BACKOFF_MS, Math.round(base));
        }

        function scheduleEnsureConnections(delayMs) {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
            }
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                ensureConnections();
            }, delayMs == null ? 200 : delayMs);
        }

        function stopKeepalive() {
            if (keepaliveTimer) {
                clearInterval(keepaliveTimer);
                keepaliveTimer = null;
            }
        }

        function formatPingLatency(ms) {
            if (ms != null && isFinite(ms)) {
                return Math.max(0, Math.round(ms)) + ' ms';
            }
            return '-- ms';
        }

        function updateLatencyDisplay() {
            if (!chipLatency) {
                return;
            }
            const hasPing = pingLatencyMs != null && isFinite(pingLatencyMs);
            chipLatency.textContent = formatPingLatency(pingLatencyMs);
            chipLatency.title = hasPing
                ? ('延迟 ' + Math.max(0, Math.round(pingLatencyMs)) + ' ms')
                : '延迟';
        }

        function handlePong() {
            lastPongAt = Date.now();
            if (!latencyPingSentAt) {
                return;
            }
            pingLatencyMs = lastPongAt - latencyPingSentAt;
            latencyPingSentAt = 0;
            updateLatencyDisplay();
        }

        function sendLatencyPing() {
            const ws = isSocketOpen(controlWs) ? controlWs : (isSocketOpen(mediaWs) ? mediaWs : null);
            if (!ws) {
                pingLatencyMs = null;
                updateLatencyDisplay();
                return;
            }
            try {
                latencyPingSentAt = Date.now();
                ws.send('ping');
            } catch (e) {
                latencyPingSentAt = 0;
            }
        }

        function startLatencyProbe() {
            stopLatencyProbe();
            sendLatencyPing();
            latencyTimer = setInterval(sendLatencyPing, LATENCY_PING_MS);
        }

        function stopLatencyProbe() {
            if (latencyTimer) {
                clearInterval(latencyTimer);
                latencyTimer = null;
            }
            latencyPingSentAt = 0;
        }

        function resetLatencyDisplay() {
            stopLatencyProbe();
            pingLatencyMs = null;
            updateLatencyDisplay();
        }

        function startKeepalive() {
            stopKeepalive();
            keepaliveTimer = setInterval(() => {
                if (intentionalTeardown) {
                    return;
                }
                // Keep pinging even while hidden so mobile browsers are less likely
                // to freeze the socket; recovery still runs on visibility return.
                if (isSocketOpen(mediaWs)) {
                    try {
                        mediaWs.send('ping');
                    } catch (e) {
                        if (!document.hidden) {
                            forceReconnect('keepalive media failed', { bypassCooldown: true });
                        }
                        return;
                    }
                }
                if (isSocketOpen(controlWs)) {
                    try {
                        controlWs.send('ping');
                    } catch (e) {
                        try { controlWs.close(); } catch (err) {}
                        controlWs = null;
                        controlConnected = false;
                        if (!document.hidden && mediaConnected && sessionToken) {
                            scheduleEnsureConnections(100);
                        }
                    }
                } else if (!document.hidden && mediaConnected && sessionToken && !isSocketBusy(controlWs)) {
                    scheduleEnsureConnections(100);
                }
            }, KEEPALIVE_MS);
        }

        function stopStallWatch() {
            if (stallWatchTimer) {
                clearInterval(stallWatchTimer);
                stallWatchTimer = null;
            }
        }

        function startStallWatch() {
            stopStallWatch();
            stallWatchTimer = setInterval(() => {
                if (document.hidden || reconnecting || intentionalTeardown) {
                    return;
                }
                const now = Date.now();

                // Hung CONNECTING sockets block all reconnect paths — kill them.
                if (mediaWs && mediaWs.readyState === WebSocket.CONNECTING
                    && mediaConnectStartedAt && now - mediaConnectStartedAt > CONNECT_TIMEOUT_MS) {
                    console.warn('media connect timeout');
                    closeSocketQuiet(mediaWs);
                    mediaWs = null;
                    mediaConnected = false;
                    forceReconnect('media connect timeout', { bypassCooldown: true });
                    return;
                }
                if (controlWs && controlWs.readyState === WebSocket.CONNECTING
                    && controlConnectStartedAt && now - controlConnectStartedAt > CONNECT_TIMEOUT_MS) {
                    console.warn('control connect timeout');
                    closeSocketQuiet(controlWs);
                    controlWs = null;
                    controlConnected = false;
                    scheduleEnsureConnections(100);
                    return;
                }

                if (!isSocketOpen(mediaWs)) {
                    if (!isSocketBusy(mediaWs)) {
                        scheduleEnsureConnections(100);
                    }
                    return;
                }
                if (!isSocketOpen(controlWs) && sessionToken && !isSocketBusy(controlWs)) {
                    scheduleEnsureConnections(100);
                    refreshConnectionChip();
                }

                // Video packets flowing but no frames drawn → decoder stuck waiting for key.
                if (canvasPlayer && lastVideoPacketAt
                    && (!lastPresentedAt || now - lastPresentedAt > KEYFRAME_WAIT_MS)
                    && now - lastVideoPacketAt < 1500) {
                    canvasPlayer.waitingForKey = true;
                }

                // A silent media stream is NORMAL (static remote screen).
                // Judge link liveness by ping/pong heartbeat instead. But right
                // after switching back from a background tab the heartbeat is
                // stale simply because the keepalive was frozen — skip during the
                // grace window so we don't tear down a healthy link (recover-from-
                // background is probing it with a fresh ping meanwhile).
                const lastHealthAt = Math.max(lastPongAt || 0, lastMediaPacketAt || 0);
                if (lastHealthAt && now - lastHealthAt > HEALTH_STALL_MS
                    && now - justResumedAt > RESUME_GRACE_MS) {
                    forceReconnect('link dead: no pong for ' + (now - lastHealthAt) + 'ms');
                    return;
                }

                // Decoder wedged: video packets keep arriving but nothing gets
                // drawn for a long time (keyframes come every second). This hits
                // both backends — the MSE <video> can freeze on a display change
                // (e.g. lock screen → home), and without this it never recovers
                // on its own, forcing a manual Safari refresh.
                if (lastPresentedAt && lastVideoPacketAt
                    && now - lastPresentedAt > WEDGED_STALL_MS
                    && now - lastVideoPacketAt < 1500) {
                    forceReconnect('decoder wedged: packets flow but no frames ('
                        + (useWebCodecs ? 'WebCodecs' : 'MSE') + ')');
                }
            }, 800);
        }

        let forceReconnectTimer = null;

        function forceReconnect(reason, opts) {
            if (typeof gateUnlocked !== 'undefined' && !gateUnlocked) {
                return;
            }
            if (supersededYielded) {
                return;  // 已让出控制权，不再触发任何重连。
            }
            if (typeof linkProbeTimer !== 'undefined' && linkProbeTimer) {
                clearTimeout(linkProbeTimer);
                linkProbeTimer = null;
            }
            const options = opts || {};
            const now = Date.now();
            if (intentionalTeardown && !options.force) {
                return;
            }
            if (!options.bypassCooldown && now - lastForceReconnectAt < FORCE_RECONNECT_COOLDOWN_MS) {
                scheduleEnsureConnections(FORCE_RECONNECT_COOLDOWN_MS - (now - lastForceReconnectAt) + 50);
                return;
            }
            lastForceReconnectAt = now;
            reconnectAttempt += 1;
            recordDiag('reconnect', reason || 'stall');
            console.warn('force reconnect:', reason || 'stall', 'attempt', reconnectAttempt);
            if (quietSwitch) {
                // 切换画质/声音触发，已是“保留最后一帧”模式，不弹加载页。
            } else if (useWebCodecs) {
                // 网络断线重连：定格最后一帧（画面定格而非黑屏），
                // 若数秒内没恢复再显示加载页。快照可防画布重配分辨率时闪黑。
                showFreezeFrame();
                quietSwitch = true;
                if (quietSwitchTimer) {
                    clearTimeout(quietSwitchTimer);
                }
                quietSwitchTimer = setTimeout(() => {
                    quietSwitch = false;
                    quietSwitchTimer = null;
                    if (!screenReady) {
                        hideFreezeFrame();
                        showScreenLoader('正在恢复连接', '重新拉流…');
                    }
                }, 6000);
                setConnectionState('reconnecting', '重连中…');
            } else {
                // MSE 降级：帧不保留，直接显示加载页。
                showScreenLoader('正在恢复连接', '画面卡住，重新拉流…');
                setConnectionState('reconnecting', '恢复连接…');
                updateStatus('画面卡住，正在恢复连接…');
            }
            intentionalTeardown = true;
            reconnecting = true;
            stopKeepalive();
            stopStallWatch();
            if (input && typeof input.releasePointerAndTouch === 'function') {
                input.releasePointerAndTouch();
            }
            if (input && typeof input.releasePressedKeys === 'function') {
                input.releasePressedKeys();
            }
            teardownSockets();
            resetStreamState();
            const delay = Math.max(options.delayMs || 0, reconnectDelayMs());
            if (forceReconnectTimer) {
                clearTimeout(forceReconnectTimer);
            }
            forceReconnectTimer = setTimeout(() => {
                forceReconnectTimer = null;
                intentionalTeardown = false;
                reconnecting = false;
                if (!document.hidden) {
                    ensureConnections();
                }
            }, Math.max(450, delay));
        }

        function openControlSocket(token, connGen) {
            if (!token || !isCurrentConnection(connGen)) {
                return;
            }
            if (isSocketBusy(controlWs)) {
                return;
            }
            const ws = new WebSocket(wsUrl('/ws/control', { token }));
            controlWs = ws;
            controlConnectStartedAt = Date.now();
            ws.binaryType = 'arraybuffer';
            ws.onmessage = (event) => {
                if (controlWs !== ws || !isCurrentConnection(connGen)) {
                    return;
                }
                if (typeof event.data !== 'string') {
                    return;
                }
                if (event.data === 'pong') {
                    handlePong();
                    return;
                }
            };
            ws.onopen = () => {
                if (controlWs !== ws || !isCurrentConnection(connGen)) {
                    return;
                }
                controlConnected = true;
                controlConnectStartedAt = 0;
                reconnecting = false;
                console.log('control websocket open');
                refreshConnectionChip();
                startLatencyProbe();
                updateStatus(
                    'connected [' + qualityConfig.label + ' '
                    + qualityConfig.max_size + 'p/' + qualityConfig.max_fps + 'fps'
                    + ', ' + (useWebCodecs ? 'WebCodecs' : 'MSE') + ']'
                    + (audioEnabled ? ', video+audio' : ', video')
                );
            };
            ws.onclose = (event) => {
                if (controlWs === ws) {
                    controlConnected = false;
                    controlWs = null;
                    controlConnectStartedAt = 0;
                }
                if (!isCurrentConnection(connGen) || intentionalTeardown) {
                    return;
                }
                if (event && event.code !== 4001) {
                    const clean = event && event.wasClean ? 'clean' : 'abrupt';
                    recordDiag('control-close', 'code=' + (event.code != null ? event.code : '?') + ' ' + clean);
                }
                refreshConnectionChip();
                if (event && event.code === 4001) {
                    sessionToken = null;
                    mediaConnected = false;
                    if (mediaWs) {
                        closeSocketQuiet(mediaWs);
                        mediaWs = null;
                    }
                    updateStatus('会话失效，正在重新连接…');
                    forceReconnect('control 4001 expired', { bypassCooldown: true });
                    return;
                }
                if (mediaConnected && sessionToken) {
                    scheduleEnsureConnections(200);
                }
            };
            ws.onerror = () => {
                console.warn('control websocket error');
            };
        }

        function readUint64Ms(bytes, offset) {
            if (offset + 8 > bytes.length) {
                return 0;
            }
            const view = new DataView(bytes.buffer, bytes.byteOffset + offset, 8);
            if (typeof view.getBigUint64 === 'function') {
                const raw = view.getBigUint64(0, false);
                if (raw > 9007199254740991n) {
                    return 0;
                }
                return Number(raw);
            }
            const hi = view.getUint32(0, false);
            const lo = view.getUint32(4, false);
            const value = hi * 0x100000000 + lo;
            return value > 9007199254740991 ? 0 : value;
        }

        function handleMediaBinary(buffer) {
            markMediaPacket();
            const bytes = toUint8Array(buffer);
            let offset = 0;
            while (offset + 5 <= bytes.length) {
                const type = bytes[offset];
                const size = ((bytes[offset + 1] << 24) | (bytes[offset + 2] << 16)
                    | (bytes[offset + 3] << 8) | bytes[offset + 4]) >>> 0;
                if (size <= 0 || offset + 5 + size > bytes.length) {
                    break;
                }
                const payload = bytes.subarray(offset + 5, offset + 5 + size);
                if (type === 1) {
                    lastVideoPacketAt = Date.now();
                    let videoPayload = payload;
                    pendingVideoSentAt = 0;
                    if (payload.length >= 8) {
                        pendingVideoSentAt = readUint64Ms(payload, 0);
                        videoPayload = payload.subarray(8);
                    }
                    parser.appendData(videoPayload);
                } else if (type === 2 && audioParser) {
                    audioParser.appendData(payload);
                }
                offset += 5 + size;
            }
        }

        function teardownSockets() {
            bumpConnectionGeneration();
            stopKeepalive();
            stopStallWatch();
            resetLatencyDisplay();
            sessionToken = null;
            mediaConnected = false;
            controlConnected = false;
            mediaConnectStartedAt = 0;
            controlConnectStartedAt = 0;
            if (controlWs) {
                closeSocketQuiet(controlWs);
                controlWs = null;
            }
            if (mediaWs) {
                closeSocketQuiet(mediaWs);
                mediaWs = null;
            }
        }

        function connectMedia() {
            if (isSocketBusy(mediaWs)) {
                return;
            }
            const connGen = connectionGeneration;
            if (quietSwitch) {
                // 切换画质：保留最后一帧，只在状态芯片提示，不弹黑色加载页。
                setConnectionState('reconnecting', '切换画质…');
            } else {
                setConnectionState('connecting', '连接中…');
                updateStatus('connecting…');
                showScreenLoader('正在连接设备', '建立媒体通道…');
            }
            const params = {
                audio_enabled: audioEnabled ? 'true' : 'false',
                quality: qualityPreset,
                video_bit_rate: qualityConfig.video_bit_rate,
                max_size: qualityConfig.max_size,
                max_fps: qualityConfig.max_fps,
            };
            const ws = new WebSocket(wsUrl('/ws/media', params));
            mediaWs = ws;
            mediaConnectStartedAt = Date.now();
            ws.binaryType = 'arraybuffer';

            ws.onopen = () => {
                if (mediaWs !== ws || !isCurrentConnection(connGen)) {
                    return;
                }
                mediaConnected = true;
                mediaConnectStartedAt = 0;
                reconnecting = false;
                lastPongAt = Date.now();
                lastConnectedAt = Date.now();
                recordDiag('connected', '媒体已连接');
                startKeepalive();
                startStallWatch();
                startLatencyProbe();
                refreshConnectionChip();
                layoutDeviceFrame();
                if (useWebAudio && webAudioPlayer && audioUnlocked) {
                    webAudioPlayer.resume().catch(() => {});
                }
            };

            ws.onmessage = (event) => {
                if (mediaWs !== ws || !isCurrentConnection(connGen)) {
                    return;
                }
                if (typeof event.data === 'string') {
                    if (event.data === 'ping') {
                        return;
                    }
                    if (event.data === 'pong') {
                        handlePong();
                        return;
                    }
                    let msg;
                    try {
                        msg = JSON.parse(event.data);
                    } catch (e) {
                        return;
                    }
                    if (msg.type === 'session') {
                        sessionToken = msg.token;
                        openControlSocket(sessionToken, connGen);
                        if (canvasPlayer) {
                            canvasPlayer.waitingForKey = true;
                        }
                        refreshConnectionChip();
                        updateStatus(
                            'connected [' + qualityConfig.label + ' '
                            + qualityConfig.max_size + 'p/' + qualityConfig.max_fps + 'fps'
                            + ', ' + (useWebCodecs ? 'WebCodecs' : 'MSE') + ']'
                            + (audioEnabled ? ', video+audio' : ', video')
                        );
                        console.log('session', msg);
                    } else if (msg.type === 'error') {
                        updateStatus('error: ' + msg.message);
                        setConnectionState('offline', '连接失败');
                        forceReconnect('media error: ' + msg.message, { bypassCooldown: true, force: true, delayMs: 700 });
                    }
                    return;
                }
                handleMediaBinary(event.data);
            };

            ws.onclose = (event) => {
                if (mediaWs !== ws) {
                    return;
                }
                const closeCode = event && event.code != null ? event.code : null;
                if (!intentionalTeardown) {
                    const code = closeCode != null ? closeCode : '?';
                    const clean = event && event.wasClean ? 'clean' : 'abrupt';
                    recordDiag('media-close', 'code=' + code + ' ' + clean);
                }
                stopKeepalive();
                stopStallWatch();
                resetLatencyDisplay();
                mediaConnected = false;
                mediaWs = null;
                mediaConnectStartedAt = 0;
                sessionToken = null;
                if (controlWs) {
                    closeSocketQuiet(controlWs);
                    controlWs = null;
                }
                controlConnected = false;
                controlConnectStartedAt = 0;
                reconnecting = false;
                // 服务器用 4009 通知“已被其他设备接管”：礼貌让出，不再自动重连。
                if (closeCode === WS_CLOSE_SUPERSEDED) {
                    enterSupersededMode();
                    return;
                }
                if (!isCurrentConnection(connGen) || intentionalTeardown) {
                    return;
                }
                setConnectionState('reconnecting', '重连中…');
                updateStatus('连接已断开，正在自动重连…');
                scheduleEnsureConnections(reconnectDelayMs());
            };

            ws.onerror = () => {
                if (!isCurrentConnection(connGen)) {
                    return;
                }
                console.warn('media websocket error');
            };
        }

        function ensureConnections() {
            if (typeof gateUnlocked !== 'undefined' && !gateUnlocked) {
                return;
            }
            if (supersededYielded) {
                return;  // 已让出控制权，除非用户点“重新接管”，否则不再连接。
            }
            if (document.hidden || intentionalTeardown || reconnecting) {
                return;
            }
            if (!isSocketOpen(mediaWs) && !isSocketBusy(mediaWs)) {
                reconnecting = true;
                teardownSockets();
                resetStreamState();
                connectMedia();
                return;
            }
            if (mediaConnected && sessionToken && !isSocketOpen(controlWs) && !isSocketBusy(controlWs)) {
                openControlSocket(sessionToken, connectionGeneration);
            }
        }

        // —— 被其他设备顶替：礼貌让出 / 重新接管 ——
        const takeoverOverlay = document.getElementById('takeover-overlay');
        function enterSupersededMode() {
            if (supersededYielded) {
                return;
            }
            supersededYielded = true;
            // 用 intentionalTeardown 挡住所有隐式重连路径，直到用户主动接管。
            intentionalTeardown = true;
            reconnecting = false;
            stopKeepalive();
            stopStallWatch();
            if (typeof linkProbeTimer !== 'undefined' && linkProbeTimer) {
                clearTimeout(linkProbeTimer);
                linkProbeTimer = null;
            }
            if (forceReconnectTimer) {
                clearTimeout(forceReconnectTimer);
                forceReconnectTimer = null;
            }
            if (typeof reconnectTimer !== 'undefined' && reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
            teardownSockets();
            applyNotifyAlert(false);   // 让出期间不显示本机通知红点
            hideFreezeFrame();
            setConnectionState('offline', '已在其他设备打开');
            updateStatus('已在其他设备上打开控制');
            recordDiag('superseded', '被其他设备接管，已让出');
            if (takeoverOverlay) {
                takeoverOverlay.classList.add('is-open');
            }
        }

        function exitSupersededMode() {
            if (!supersededYielded) {
                return;
            }
            supersededYielded = false;
            intentionalTeardown = false;
            reconnecting = false;
            reconnectAttempt = 0;
            if (takeoverOverlay) {
                takeoverOverlay.classList.remove('is-open');
            }
            setConnectionState('connecting', '重新接管…');
            showScreenLoader('正在接管控制', '重新连接设备…');
            recordDiag('takeover', '本设备重新接管');
            ensureConnections();  // 重新连上 = 把当前控制方顶下
        }

        (function bindTakeover() {
            const btn = document.getElementById('takeover-btn');
            if (btn) {
                btn.addEventListener('click', (e) => { e.preventDefault(); exitSupersededMode(); });
            }
        })();

        // Prefer "actually drawn" heartbeat over "packet received".
        if (canvasPlayer) {
            canvasPlayer.onFramePresented = markFramePresented;
        } else if (fallbackVideo) {
            fallbackVideo.addEventListener('timeupdate', markFramePresented);
            fallbackVideo.addEventListener('playing', markFramePresented);
        }

        // —— Disguise gate: hold the real connection until the hidden corner
        // is tapped 3 times. Every page load re-arms it (no persistence). ——
        const offlineGate = document.getElementById('offline-gate');
        const offlineHotspot = document.getElementById('offline-hotspot');
        let gateUnlocked = false;
        // 每次进入只在“第一帧画面出来时”补一次唤醒（见 markFramePresented）。
        let wakeOnFirstFrameDone = false;
        // 刚点三下进来的时间。唤醒手机要约 1 秒，而通知轮询有服务端缓存，
        // 期间会读到“手机还睡着”的旧状态而把伪装页又盖回来。用宽限期避开这个竞态。
        let gateUnlockedAt = 0;
        const GATE_RELOCK_GRACE_MS = 15000;


        function startRealSession() {
            if (gateUnlocked) {
                return;
            }
            gateUnlocked = true;
            gateUnlockedAt = Date.now();
            if (offlineGate) {
                offlineGate.classList.add('is-gone');
            }
            // 手机会按自己的设置自动息屏/锁屏，而 scrcpy 的触摸唤不醒休眠中的设备。
            // 所以进入时让服务端用 adb 唤醒；若在锁屏就直接调出 PIN 输入盘。
            // 记住了 PIN（锁屏黑屏机型）就直接盲解锁；否则只唤醒。
            wakeOrUnlock(false);
            // 让手机端的输入法开关和本页记住的输入方式保持一致（换设备/重装后也对得上）。
            pushDeviceImeMode(inputMode === 'device');
            connectMedia();
            startNotificationWatch();
        }

        // 隐私伪装：一旦切走浏览器标签 / 切到后台 / 熄屏，立刻盖回“断网小恐龙”页，
        // 回来时需重新点右下角 3 下才进真实界面。连接保留在后台，重新解锁后画面立即恢复。
        function relockGate() {
            if (isDesktopView) {
                return;   // 桌面端不做伪装，切走标签也不盖回伪装页
            }
            if (!gateUnlocked || !offlineGate) {
                return;
            }
            gateUnlocked = false;
            // 下次再进来时要重新补一次唤醒。
            wakeOnFirstFrameDone = false;
            offlineGate.classList.remove('is-gone');
        }
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                relockGate();
            }
        });

        // —— 消息通知红点：QQ / 微信 / Soul 有新消息时悬浮球变红 ——
        const NOTIFY_POLL_MS = 5000;
        let notifyTimer = null;
        // 不做锁存：直接跟随服务端的判断。
        // 曾经用一个“未读锁存集合”防漏消息，但它唯一的清除途径是“打开那个 App”，
        // 于是通知以别的方式消失时（在手机上直接看了/划掉了/系统自动清掉）跑马灯
        // 会一直亮着，而消息早就没了。服务端已经排除了前台 App，d.alert 就是答案。
        function applyNotifyAlert(on) {
            const fab = document.getElementById('fab-tools');
            if (fab) {
                fab.classList.toggle('has-alert', !!on);
            }
        }
        function pollNotifications() {
            if (document.hidden || !gateUnlocked || supersededYielded) {
                return;  // 让出控制权期间不查通知，避免无谓的 adb 占用。
            }
            fetch('/api/notifications?ts=' + Date.now(), { cache: 'no-store' })
                .then((r) => (r.ok ? r.json() : null))
                .then((d) => {
                    if (!d) {
                        return;
                    }
                    // 服务端已把“在前台的 App”排除掉，所以打开对应 App 就会自动熄灭。
                    applyNotifyAlert(!!d.alert);

                    // 手机睡着了（息屏）→ 盖回伪装页，这样随时可以点三下唤醒进 PIN。
                    // 只看“是否睡着”，不看“是否锁定”：正在输 PIN 时手机是醒着的，
                    // 若按锁定判断会把伪装页弹出来挡住输入。
                    // 宽限期：刚点三下进来时手机还没唤醒完（且状态有缓存），
                    // 这段时间不盖回去，否则会刚进来就被弹回伪装页。
                    if (d.awake === false
                        && Date.now() - gateUnlockedAt > GATE_RELOCK_GRACE_MS) {
                        relockGate();
                    }
                })
                .catch(() => {});
        }
        function startNotificationWatch() {
            if (notifyTimer) {
                return;
            }
            pollNotifications();
            notifyTimer = setInterval(pollNotifications, NOTIFY_POLL_MS);
            // 从后台切回前台时立刻刷新一次，红点状态更跟手。
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    pollNotifications();
                }
            });
        }

        // Switching quality/audio reloads the page; that reload should NOT
        // re-show the dino gate (the user already unlocked this session).
        let skipGateOnce = false;
        try {
            skipGateOnce = sessionStorage.getItem('scrcpySkipGate') === '1';
            if (skipGateOnce) {
                sessionStorage.removeItem('scrcpySkipGate');
            }
        } catch (e) {}

        // 桌面端（电脑）不做伪装：直接进真实界面。伪装页只为手机丢失/被人瞥见时的
        // 隐私，电脑上没这需求。isDesktopView 看有没有鼠标，缩小窗口骗不过它。
        if (offlineGate && offlineHotspot && !skipGateOnce && !isDesktopView) {
            const TAP_WINDOW_MS = 2500;
            const TAPS_NEEDED = 3;
            let tapCount = 0;
            let firstTapAt = 0;
            const onHotspotTap = (event) => {
                event.preventDefault();
                event.stopPropagation();
                const now = Date.now();
                if (now - firstTapAt > TAP_WINDOW_MS) {
                    tapCount = 0;
                    firstTapAt = now;
                }
                tapCount += 1;
                if (tapCount >= TAPS_NEEDED) {
                    tapCount = 0;
                    startRealSession();
                }
            };
            // pointerup fires once per tap on both touch and mouse.
            offlineHotspot.addEventListener('pointerup', onHotspotTap);
            // iOS Safari's double-tap-zoom gesture recognizer watches raw touch
            // events, not pointerup — preventDefault() there doesn't stop it.
            // Cancel it directly on touchend so 3 quick taps never zoom the page.
            offlineHotspot.addEventListener('touchend', (e) => { e.preventDefault(); }, { passive: false });
        } else {
            // Gate markup missing, or a quality/audio switch — skip straight in.
            // 若这是"切画质整页重载"回来的：贴回重载前定格的那一帧，并进入安静切换
            // 模式，让 connectMedia 不弹加载页——电脑端 MSE 路径切换也不再黑屏。
            if (skipGateOnce && restoreSwitchSnapshot()) {
                quietSwitch = true;
                if (quietSwitchTimer) {
                    clearTimeout(quietSwitchTimer);
                }
                quietSwitchTimer = setTimeout(() => {
                    quietSwitch = false;
                    quietSwitchTimer = null;
                    if (!screenReady) {
                        hideFreezeFrame();
                        showScreenLoader('正在切换画质', '重新拉流…');
                    }
                }, 12000);
            }
            startRealSession();
        }

        // After a long background suspend the socket may still report OPEN yet
        // be a zombie (iOS freezes WebSockets in background). Rather than tear a
        // possibly-healthy link down, ping it and reconnect ONLY if no pong
        // arrives — this removes the jarring reconnect every time you return.
        const LINK_PROBE_MS = 1800;
        let linkProbeTimer = null;

        function probeLinkThenMaybeReconnect(source, awayMs) {
            const probeStart = Date.now();
            let sent = false;
            if (isSocketOpen(controlWs)) {
                try { controlWs.send('ping'); sent = true; } catch (e) {}
            }
            if (isSocketOpen(mediaWs)) {
                try { mediaWs.send('ping'); sent = true; } catch (e) {}
            }
            if (!sent) {
                forceReconnect(source + ' probe-nosocket away=' + awayMs + 'ms',
                    { bypassCooldown: true, delayMs: 450 });
                return;
            }
            setConnectionState('connecting', '检查连接…');
            if (linkProbeTimer) {
                clearTimeout(linkProbeTimer);
            }
            linkProbeTimer = setTimeout(() => {
                linkProbeTimer = null;
                if (document.hidden || intentionalTeardown) {
                    return;
                }
                if (lastPongAt > probeStart) {
                    // Pong came back → link is alive, keep it (no reconnect).
                    scheduleEnsureConnections(50);
                    refreshConnectionChip();
                } else {
                    forceReconnect(source + ' probe-timeout away=' + awayMs + 'ms',
                        { bypassCooldown: true, delayMs: 300 });
                }
            }, LINK_PROBE_MS);
        }

        function recoverFromBackground(source) {
            if (!gateUnlocked) {
                return;
            }
            if (supersededYielded) {
                return;  // 已让出控制权，切前台不自动重连。
            }
            if (document.hidden) {
                return;
            }
            // 刚切回前台：给一段宽限期，别让 stall watch 因为“后台期间心跳暂停、
            // 现在心跳旧”就误判 link dead 去重连（重连=手机重启 scrcpy=卡顿）。
            justResumedAt = Date.now();
            // Debounce focus+visibility+pageshow firing together.
            if (recoverDebounceTimer) {
                clearTimeout(recoverDebounceTimer);
            }
            recoverDebounceTimer = setTimeout(() => {
                recoverDebounceTimer = null;
                if (document.hidden || intentionalTeardown) {
                    return;
                }
                const awayMs = hiddenAt ? (Date.now() - hiddenAt) : 0;
                hiddenAt = 0;
                const now = Date.now();
                // Ignore spurious focus/pageshow during the very first connect.
                const hadLiveSession = !!(lastPresentedAt || lastMediaPacketAt || sessionToken);
                if (!hadLiveSession && awayMs < 500) {
                    scheduleEnsureConnections(50);
                    return;
                }
                const mediaDead = !isSocketBusy(mediaWs);
                const controlDead = hadLiveSession && mediaConnected && sessionToken && !isSocketBusy(controlWs);
                // A silent media stream is normal (static remote screen);
                // judge liveness by the ping/pong heartbeat instead.
                const lastHealthAt = Math.max(lastPongAt || 0, lastMediaPacketAt || 0);
                const linkDead = !!lastHealthAt && (now - lastHealthAt > HEALTH_STALL_MS);

                // Resume playback-side state on every return (cheap, no teardown).
                if (canvasPlayer) {
                    canvasPlayer.waitingForKey = true;
                }
                if (input && typeof input.releasePointerAndTouch === 'function') {
                    input.releasePointerAndTouch();
                }
                if (input && keyboardEnabled && isDesktopView) {
                    input.ensureKeyboardInputFocused();
                }
                resumeAudioIfNeeded();
                requestAudioUnlock();

                if (mediaDead || controlDead) {
                    // A socket is actually closed — reconnect now.
                    forceReconnect(
                        source + (mediaDead ? ' media-dead' : '')
                        + (controlDead ? ' control-dead' : '')
                        + (awayMs ? (' away=' + awayMs + 'ms') : ''),
                        { bypassCooldown: true, delayMs: awayMs >= 5000 ? 600 : 450 }
                    );
                    return;
                }

                // Sockets still OPEN. A stale heartbeat here is NORMAL — switching
                // to another browser tab freezes this tab's timers, so the keepalive
                // ping pauses and lastPong goes old even though the link is fine.
                // So DON'T treat a stale heartbeat as dead: ping first, and reconnect
                // only if no pong comes back. A needless reconnect restarts scrcpy on
                // the phone (a multi-second stutter) — exactly the lag on tab-return.
                if (linkDead || (awayMs >= HIDDEN_FORCE_MS && hadLiveSession)) {
                    probeLinkThenMaybeReconnect(source, awayMs);
                } else {
                    // Short, healthy return — just nudge connections.
                    scheduleEnsureConnections(50);
                    refreshConnectionChip();
                }
            }, 60);
        }

        // Browser throttles/suspends WS when tab is hidden; restore on return.
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                hiddenAt = Date.now();
                return;
            }
            recoverFromBackground('visibility');
        });
        window.addEventListener('focus', () => {
            recoverFromBackground('focus');
        });
        window.addEventListener('pageshow', () => {
            recoverFromBackground('pageshow');
        });
        window.addEventListener('online', () => {
            if (!isSocketOpen(mediaWs) || !isSocketOpen(controlWs)) {
                forceReconnect('network online', { bypassCooldown: true });
            } else {
                scheduleEnsureConnections(50);
            }
        });

        window.addEventListener('offline', () => {
            setConnectionState('offline', '网络断开');
            updateStatus('网络已断开');
        });

        window.addEventListener('beforeunload', () => {
            intentionalTeardown = true;
            stopKeepalive();
            stopStallWatch();
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
            }
            if (recoverDebounceTimer) {
                clearTimeout(recoverDebounceTimer);
            }
            if (forceReconnectTimer) {
                clearTimeout(forceReconnectTimer);
            }
            if (linkProbeTimer) {
                clearTimeout(linkProbeTimer);
                linkProbeTimer = null;
            }
            teardownSockets();
            resetStreamState();
            if (canvasPlayer) {
                canvasPlayer.destroy();
            }
        });
    </script>
</body>

</html>

    </div>

    <!-- Diagnostics: long-press the floating ball to open. Lists recent
         reconnects so disconnection causes can be reported. -->
    <div class="diag-overlay" id="diag-overlay">
        <div class="diag-card">
            <div class="diag-head">
                <span>连接诊断</span>
                <div class="diag-actions">
                    <button type="button" id="diag-reboot" class="diag-btn diag-reboot">重启手机</button>
                    <button type="button" id="diag-copy" class="diag-btn diag-copy">复制</button>
                    <button type="button" id="diag-close" class="diag-btn diag-close">关闭</button>
                </div>
            </div>
            <textarea id="diag-text" class="diag-text" readonly wrap="off" aria-label="诊断日志"></textarea>

            <!-- 盲解锁：锁屏黑屏的机型（如 OPPO/ColorOS）用它把 PIN 发进去解锁。 -->
            <div class="diag-unlock">
                <input type="password" id="unlock-pin" class="unlock-pin" inputmode="numeric"
                       autocomplete="off" placeholder="手机 PIN（盲解锁）" aria-label="手机 PIN" />
                <label class="unlock-remember"><input type="checkbox" id="unlock-remember" /> 记住</label>
                <button type="button" id="unlock-send" class="diag-btn diag-copy">解锁</button>
            </div>

            <!-- 粘贴到手机：手机端（iPhone）没有本机键盘映射通路，靠这里把文字送过去。
                 http+IP 不是安全上下文，navigator.clipboard 读不了，所以留一个输入框
                 让用户手动粘贴；能读剪贴板时点“读剪贴板”自动填。 -->
            <div class="diag-paste">
                <textarea id="paste-text" class="paste-text" rows="2" autocomplete="off"
                          autocorrect="off" autocapitalize="off" spellcheck="false"
                          placeholder="粘贴要发到手机的文字…" aria-label="要发送到手机的文字"></textarea>
                <div class="paste-actions">
                    <button type="button" id="paste-read" class="diag-btn diag-copy">读剪贴板</button>
                    <button type="button" id="paste-clear" class="diag-btn diag-copy">清除</button>
                    <button type="button" id="paste-send" class="diag-btn diag-copy">发到手机</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 被其他设备顶替时的礼貌让出提示（避免两端互相反复重连）。 -->
    <div class="takeover-overlay" id="takeover-overlay" role="status" aria-live="polite">
        <div class="takeover-card">
            <div class="takeover-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="2" width="14" height="20" rx="2.5"/>
                    <line x1="12" y1="18" x2="12" y2="18"/>
                </svg>
            </div>
            <strong>已在其他设备上打开控制</strong>
            <span>此设备已让出控制权。若要在本设备继续，请点击重新接管。</span>
            <button type="button" id="takeover-btn" class="takeover-btn">在本设备重新接管</button>
        </div>
    </div>

    <script src="/static/js/jmuxer.min.js?v=21"></script>
    <script>
        const AUDIO_STORAGE_KEY = 'audioEnabled';
        const KEYBOARD_STORAGE_KEY = 'keyboardEnabled';
        const QUALITY_STORAGE_KEY = 'qualityPreset';

        const QUALITY_PRESETS = {
            clear: {
                label: '原画',
                // Native Pixel 2 resolution (1080x1920): max_size caps the LONG
                // edge, so 1920 keeps full sharpness on 3x retina displays.
                // 5 Mbps fits typical home upload; 8 Mbps saturated it on motion.
                video_bit_rate: '5000000',
                max_size: '1920',
                max_fps: '30',
                jmuxerFps: 30,
                // App open/close animations spike to ~16 Mbps for ~1s. Deeper
                // buffer + higher stale tolerance ride through the burst instead
                // of dropping frames mid-transition (the visible stutter). The
                // extra latency only applies DURING a burst and recovers after.
                maxDelay: 450,
                staleFrameMs: 450,
                maxDecodeQueue: 6,
            },
            hd: {
                label: '高清',
                // 介于清晰和均衡之间：1280 长边 + 3Mbps，比 800p 明显清晰，
                // 带宽只有清晰档的 ~60%，弱网下更稳。
                video_bit_rate: '3000000',
                max_size: '1280',
                max_fps: '30',
                jmuxerFps: 30,
                maxDelay: 300,
                staleFrameMs: 300,
                maxDecodeQueue: 4,
            },
            balanced: {
                label: '均衡',
                video_bit_rate: '2000000',
                max_size: '800',
                max_fps: '30',
                jmuxerFps: 30,
                maxDelay: 180,
                staleFrameMs: 150,
                maxDecodeQueue: 3,
            },
            smooth: {
                label: '清晰',
                video_bit_rate: '1200000',
                max_size: '720',
                max_fps: '30',
                jmuxerFps: 30,
                maxDelay: 140,
                staleFrameMs: 120,
                maxDecodeQueue: 2,
            },
        };

        function loadAudioEnabled() {
            const val = localStorage.getItem(AUDIO_STORAGE_KEY);
            if (val === null) {
                return true;
            }
            return val === 'true';
        }

        function saveAudioEnabled(enabled) {
            localStorage.setItem(AUDIO_STORAGE_KEY, enabled ? 'true' : 'false');
        }

        function loadKeyboardEnabled() {
            return localStorage.getItem(KEYBOARD_STORAGE_KEY) === 'true';
        }

        function saveKeyboardEnabled(enabled) {
            localStorage.setItem(KEYBOARD_STORAGE_KEY, enabled ? 'true' : 'false');
        }

        // 输入方式：'local' = 用本机(iPhone)键盘打字注入；'device' = 用手机自己的输入法
        // （点手机上的文本框会弹出，支持拼音候选词）。长按键盘按钮切换。
        const INPUT_MODE_KEY = 'inputMode';
        function loadInputMode() {
            return localStorage.getItem(INPUT_MODE_KEY) === 'device' ? 'device' : 'local';
        }
        function saveInputMode(mode) {
            localStorage.setItem(INPUT_MODE_KEY, mode);
        }

        // 盲解锁 PIN（可选记住）。仅存在本机浏览器；用于锁屏黑屏机型远程解锁。
        const DEVICE_PIN_KEY = 'devicePin';
        const REMEMBER_PIN_KEY = 'rememberPin';
        function loadDevicePin() { return localStorage.getItem(DEVICE_PIN_KEY) || ''; }
        function saveDevicePin(pin) {
            if (pin) { localStorage.setItem(DEVICE_PIN_KEY, pin); }
            else { localStorage.removeItem(DEVICE_PIN_KEY); }
        }
        function loadRememberPin() { return localStorage.getItem(REMEMBER_PIN_KEY) === 'true'; }
        function saveRememberPin(on) { localStorage.setItem(REMEMBER_PIN_KEY, on ? 'true' : 'false'); }

        // 把 PIN 发到后端盲解锁（PIN 走请求体，不进 URL / 日志）。
        // quiet=true 时不提示“正在解锁/已解锁”（自动解锁用），但失败仍提示。
        // 返回 Promise<boolean>：调用方（如 PIN 弹框）据此决定是否关闭。
        function sendUnlock(pin, quiet) {
            if (!quiet) {
                showKeyboardHint('正在解锁…');
            }
            return fetch('/api/unlock', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin: pin }),
            })
                .then((r) => (r.ok ? r.json() : null))
                .then((d) => {
                    if (d && d.ok) {
                        if (!quiet) { showKeyboardHint('已解锁'); }
                        return true;
                    }
                    if (d && d.error === 'invalid-pin') {
                        showKeyboardHint('PIN 格式不对（4–16 位数字）');
                    } else {
                        showKeyboardHint('解锁失败，PIN 是否正确？');
                    }
                    return false;
                })
                .catch(() => {
                    if (!quiet) { showKeyboardHint('解锁请求失败，检查连接'); }
                    return false;
                });
        }

        // 进入 / 首帧时的动作：
        //   存了 PIN            → 直接自动盲解锁，落到桌面
        //   没存 PIN 且手机锁着 → 弹 PIN 输入框（仅 OPPO 这种锁屏黑屏的机型，
        //                         否则用户面对的就是一整片黑屏，无从下手）
        //   没锁                → 只唤醒
        // 谷歌2 锁屏画面看得见，唤醒后直接在画面上滑动输密码即可，不弹框。
        function wakeOrUnlock(quiet) {
            if (loadRememberPin() && loadDevicePin()) {
                sendUnlock(loadDevicePin(), quiet);
                return;
            }
            fetch('/api/wake?ts=' + Date.now(), { cache: 'no-store' })
                .then((r) => (r.ok ? r.json() : null))
                .then((d) => {
                    if (d && d.locked && isTargetDevice) {
                        showPinPrompt();
                    }
                })
                .catch(() => {});
        }

        // —— 锁屏 PIN 输入框 ——
        // 自带一份 tap 绑定：诊断面板里那个 bindTapAction 是定义在它自己作用域内的
        // const，这里取不到。iOS 上必须同时处理 touchend 与 click，并互相去重，
        // 否则会触发两次（也会连带把页面放大）。
        function bindPinTap(el, action) {
            if (!el) { return; }
            let touchHandled = false;
            el.addEventListener('touchend', (e) => {
                e.preventDefault();
                touchHandled = true;
                action();
            }, { passive: false });
            el.addEventListener('click', (e) => {
                e.preventDefault();
                if (touchHandled) { touchHandled = false; return; }
                action();
            });
        }

        let pinPromptBound = false;
        function hidePinPrompt() {
            const gate = document.getElementById('pin-gate');
            if (!gate) { return; }
            gate.hidden = true;
            const input = document.getElementById('pin-gate-input');
            if (input) { input.value = ''; input.blur(); }
        }
        function showPinPrompt() {
            const gate = document.getElementById('pin-gate');
            const input = document.getElementById('pin-gate-input');
            const remember = document.getElementById('pin-gate-remember');
            if (!gate || !input) { return; }
            if (gate.hidden === false) { return; }   // 已经开着，别重复弹
            gate.hidden = false;
            if (remember) { remember.checked = loadRememberPin(); }

            if (!pinPromptBound) {
                pinPromptBound = true;
                const submit = () => {
                    const pin = (input.value || '').trim();
                    if (!/^\d{4,16}$/.test(pin)) {
                        showKeyboardHint('请输入 4–16 位数字 PIN');
                        return;
                    }
                    if (remember && remember.checked) {
                        saveDevicePin(pin);
                        saveRememberPin(true);
                    } else {
                        saveDevicePin('');
                        saveRememberPin(false);
                    }
                    sendUnlock(pin, false).then((ok) => {
                        if (ok) { hidePinPrompt(); }
                        else if (input) { input.value = ''; input.focus(); }
                    });
                };
                bindPinTap(document.getElementById('pin-gate-ok'), submit);
                bindPinTap(document.getElementById('pin-gate-cancel'), hidePinPrompt);
                // 回车直接提交，省一次点击
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); submit(); }
                });
            }
            // iOS 上要等弹框真的显示出来再聚焦，否则键盘不弹
            setTimeout(() => { try { input.focus(); } catch (e) {} }, 60);
        }

        // —— 悬浮球的活动范围：投屏画面之内 ——
        // 两个球原先按视口夹紧，于是能被拖到画面两侧的黑边里。这里改成按画面
        // （device-frame）的实际矩形夹紧，黑边就进不去了。
        // 画面还没出来（尺寸为 0）时回退到视口，避免把球夹到一个 0×0 的区域里。
        function fabBounds(size, margin) {
            const el = document.getElementById('device-frame');
            const r = el ? el.getBoundingClientRect() : null;
            const useFrame = r && r.width > size * 2 && r.height > size * 2;
            const left = useFrame ? r.left : 0;
            const top = useFrame ? r.top : 0;
            const right = useFrame ? r.right : window.innerWidth;
            const bottom = useFrame ? r.bottom : window.innerHeight;
            return {
                minX: left + margin,
                maxX: right - size - margin,
                minY: top + margin,
                maxY: bottom - size - margin,
            };
        }

        // 把越界的球拉回画面内（画面尺寸变化后调用）。
        // 只在“确实越界”时才写内联坐标：没越界的球继续用 CSS 默认位置，
        // 这样底部居中/贴右这些规则不会被无谓地固化成像素值。
        function clampFabIntoScreen(el, margin) {
            if (!el) { return; }
            const r = el.getBoundingClientRect();
            if (r.width === 0 || r.height === 0) { return; }
            const b = fabBounds(r.width, margin);
            if (b.maxX < b.minX || b.maxY < b.minY) { return; }
            const x = Math.min(Math.max(r.left, b.minX), b.maxX);
            const y = Math.min(Math.max(r.top, b.minY), b.maxY);
            if (Math.abs(x - r.left) > 0.5 || Math.abs(y - r.top) > 0.5) {
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                el.style.right = 'auto';
                el.style.bottom = 'auto';
            }
        }

        // —— 全页禁止双指缩放 ——
        // Safari 会“按站点记住页面缩放”。一旦不小心把页面放大过，之后每次进来都是
        // 放大状态：投屏画面看着被放大、伪装页只剩一片白、悬浮球位置也全乱。
        // 之前只在伪装页拦了捏合，主页面没拦，所以还是会被设置上。
        // 注意：已经被记住的缩放只能由用户在 Safari 菜单里缩回去（浏览器设置，
        // 网页无权重置）；这里做的是防止它再次被设置。
        // 只拦捏合（gesture 事件），不去动 touchend：
        // 伪装页的三连击、超人球的双击都是快速连点，在 touchend 上 preventDefault
        // 会把它们一起弄坏。双击缩放本来就已被 body 的 touch-action:manipulation 挡住。
        ['gesturestart', 'gesturechange', 'gestureend'].forEach((evt) => {
            document.addEventListener(evt, (e) => { e.preventDefault(); }, { passive: false });
        });

        // —— 导航悬浮球（仅 OPPO，CSS 里按机型显示）——
        // 手机自己的手势栏被裁掉了，用它代替：
        // 单击=返回，长按=主页，双击=最近任务，三击=从底部上滑拉出应用抽屉。
        // 球可拖动；拖动过程不触发任何按键。
        (function initFabNav() {
            const fab = document.getElementById('fab-nav');
            if (!fab) { return; }

            const KEY_BACK = 4, KEY_HOME = 3, KEY_RECENTS = 187;
            // 不跨刷新记忆位置：每次进入都回到 CSS 默认的底部居中。
            // 之前按“占窗口的比例”存坐标，但保存与恢复时的 innerWidth/innerHeight
            // 常常不一致（iOS Safari 地址栏伸缩、球尚未显示时 rect 为 0），
            // 恢复出来的位置会漂到边缘、被切掉，甚至把页面撑出横向溢出。
            // 拖动仍然有效，只是仅限本次会话。
            const OLD_POS_KEYS = ['fabNavPos', 'fabNavPos2', 'fabNavPos3'];
            try { OLD_POS_KEYS.forEach((k) => localStorage.removeItem(k)); } catch (e) {}
            const MARGIN = 8;
            const LONG_PRESS_MS = 480;
            // 连击窗口：停手超过这么久才判定点了几下。单击要等这一下才发出，
            // 是分辨双击/三击的必要代价。
            const MULTI_TAP_MS = 260;
            const DRAG_SLOP = 6;         // 超过这个位移就算拖动，不再算点击

            let dragId = null, startX = 0, startY = 0, origLeft = 0, origTop = 0;
            let dragged = false, longFired = false, longTimer = null;
            let pendingTap = null, tapCount = 0;

            function place(left, top) {
                const w = fab.offsetWidth || 48, h = fab.offsetHeight || 48;
                // 夹在投屏画面内，拖不进两侧黑边
                const b = fabBounds(Math.max(w, h), MARGIN);
                if (b.maxX < b.minX || b.maxY < b.minY) { return; }
                const x = Math.min(Math.max(left, b.minX), b.maxX);
                const y = Math.min(Math.max(top, b.minY), b.maxY);
                fab.style.left = x + 'px';
                fab.style.top = y + 'px';
                fab.style.right = 'auto';
                fab.style.bottom = 'auto';
            }
            function flash() {
                fab.classList.add('is-fired');
                setTimeout(() => fab.classList.remove('is-fired'), 180);
            }
            function fire(keycode, hint) {
                requestAudioUnlock();
                sendKeyPress(keycode);
                flash();
                if (hint) { showKeyboardHint(hint); }
            }
            // 抽屉式桌面的应用列表靠“底部上滑”打开，没有对应按键码，
            // 只能让服务端注入一次滑动。
            function openDrawer() {
                requestAudioUnlock();
                flash();
                showKeyboardHint('应用抽屉');
                fetch('/api/drawer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: '{}',
                }).then((r) => (r.ok ? r.json() : null)).then((d) => {
                    if (!d || !d.ok) { showKeyboardHint('拉抽屉失败'); }
                }).catch(() => showKeyboardHint('拉抽屉失败，检查连接'));
            }
            function clearPending() {
                if (longTimer) { clearTimeout(longTimer); longTimer = null; }
            }
            function reset() {
                clearPending();
                dragId = null;
                dragged = false;
                longFired = false;
                fab.classList.remove('is-pressed');
            }

            fab.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                if (dragId !== null) { return; }
                dragId = e.pointerId;
                try { fab.setPointerCapture(dragId); } catch (err) {}
                const r = fab.getBoundingClientRect();
                startX = e.clientX; startY = e.clientY;
                origLeft = r.left; origTop = r.top;
                dragged = false; longFired = false;
                fab.classList.add('is-pressed');
                clearPending();
                longTimer = setTimeout(() => {
                    longTimer = null;
                    if (dragged) { return; }
                    longFired = true;
                    // 长按判定成立：取消待发的连击判定，改发主页
                    if (pendingTap) { clearTimeout(pendingTap); pendingTap = null; }
                    tapCount = 0;
                    fire(KEY_HOME, '主页');
                }, LONG_PRESS_MS);
            });

            fab.addEventListener('pointermove', (e) => {
                if (dragId !== e.pointerId) { return; }
                const dx = e.clientX - startX, dy = e.clientY - startY;
                if (!dragged && Math.hypot(dx, dy) > DRAG_SLOP) {
                    dragged = true;
                    clearPending();   // 开始拖动就不再算长按
                }
                if (dragged) { place(origLeft + dx, origTop + dy); }
            });

            function onUp(e) {
                if (dragId !== e.pointerId) { return; }
                try { fab.releasePointerCapture(dragId); } catch (err) {}
                const wasDragged = dragged, wasLong = longFired;
                reset();
                if (wasDragged) { return; }   // 拖动只在本次会话内有效，不写入存储
                if (wasLong) { return; }   // 长按已经发过主页了

                // 数click次数：连击窗口内每多点一次就重置计时，停手后按总数决定动作。
                // 1=返回  2=最近任务  3=从底部上滑拉抽屉
                tapCount += 1;
                if (pendingTap) { clearTimeout(pendingTap); }
                pendingTap = setTimeout(() => {
                    pendingTap = null;
                    const n = tapCount;
                    tapCount = 0;
                    if (n === 1) {
                        fire(KEY_BACK, '');          // 返回最常用，不弹提示免得刷屏
                    } else if (n === 2) {
                        fire(KEY_RECENTS, '最近任务');
                    } else {
                        openDrawer();                 // 三击及以上
                    }
                }, MULTI_TAP_MS);
            }
            fab.addEventListener('pointerup', onUp);
            fab.addEventListener('pointercancel', (e) => {
                if (dragId !== e.pointerId) { return; }
                reset();
            });

            window.addEventListener('resize', () => {
                // 没拖动过就一直用 CSS 默认位置（底部居中），别插手：
                // iOS Safari 地址栏伸缩会频繁触发 resize，一旦这里改写成
                // 内联 left/top，球就脱离了居中规则，容易漂到边上甚至被切掉。
                if (!fab.style.left) { return; }
                const r = fab.getBoundingClientRect();
                // 球在 /api/whoami 返回前是 display:none，此时 rect 全是 0，
                // 把这个 0 当坐标会被 place() 夹到 (8,8)，也就是钉死在左上角。
                if (r.width === 0 || r.height === 0) { return; }
                place(r.left, r.top);   // 拖动过的球：旋转/改窗口后夹回屏内
            });
        })();

        function loadQualityPreset() {
            const saved = localStorage.getItem(QUALITY_STORAGE_KEY);
            if (saved && QUALITY_PRESETS[saved]) {
                return saved;
            }
            return 'balanced';
        }

        function saveQualityPreset(preset) {
            localStorage.setItem(QUALITY_STORAGE_KEY, preset);
        }

        let audioEnabled = loadAudioEnabled();
        const isDesktopView = ScrcpyInput.isDesktopView();
        let keyboardEnabled = isDesktopView && loadKeyboardEnabled();
        let inputMode = loadInputMode();
        let qualityPreset = loadQualityPreset();
        let qualityConfig = QUALITY_PRESETS[qualityPreset];
        const canvasElement = document.getElementById('player');
        const fallbackVideo = document.getElementById('fallback-player');
        const audioElement = document.getElementById('audio-player');
        const videoWrapper = document.getElementById('video-wrapper');
        const mobileKeyboardInput = document.getElementById('mobile-keyboard-input');
        const keyboardHint = document.getElementById('keyboard-hint');
        const qualitySelect = document.getElementById('quality-select');
        const qualitySeg = document.getElementById('quality-seg');
        const deviceChip = document.getElementById('device-chip');
        const chipLabel = document.getElementById('chip-label');
        const chipLatency = document.getElementById('chip-latency');
        const deviceFrame = document.getElementById('device-frame');
        const screenLoader = document.getElementById('screen-loader');
        const loaderTitle = document.getElementById('loader-title');
        const loaderSub = document.getElementById('loader-sub');
        let screenReady = false;
        fallbackVideo.muted = true;
        audioElement.volume = 1;
        try { audioElement.setAttribute('playsinline', ''); } catch (e) {}
        try { audioElement.setAttribute('webkit-playsinline', ''); } catch (e) {}
        if (qualitySelect) {
            qualitySelect.value = qualityPreset;
        }
        function syncQualitySeg() {
            if (!qualitySeg) {
                return;
            }
            qualitySeg.querySelectorAll('button').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.q === qualityPreset);
            });
        }
        syncQualitySeg();

        function setLoaderCopy(title, sub) {
            if (loaderTitle && title) {
                loaderTitle.textContent = title;
            }
            if (loaderSub && sub) {
                loaderSub.textContent = sub;
            }
        }

        function showScreenLoader(title, sub) {
            screenReady = false;
            // 一旦真正弹出加载页，就不再需要定格快照，撤掉以防它卡住盖住加载页。
            if (typeof hideFreezeFrame === 'function') {
                hideFreezeFrame();
            }
            if (screenLoader) {
                screenLoader.classList.remove('is-hidden');
            }
            setLoaderCopy(title || '正在连接设备', sub || '等待画面…');
        }

        function hideScreenLoader() {
            if (screenReady) {
                return;
            }
            screenReady = true;
            if (screenLoader) {
                screenLoader.classList.add('is-hidden');
            }
        }

        function setConnectionState(state, label) {
            if (deviceChip) {
                deviceChip.dataset.state = state;
            }
            if (chipLabel && label) {
                chipLabel.textContent = label;
            }
            if (!screenReady) {
                if (state === 'reconnecting') {
                    setLoaderCopy('正在恢复连接', label || '重新连接…');
                } else if (state === 'offline') {
                    setLoaderCopy('连接异常', label || '请检查设备');
                } else if (state === 'connecting') {
                    setLoaderCopy('正在连接设备', label || '等待画面…');
                }
            }
        }

        const useWebCodecs = H264CanvasPlayer.isSupported();
        let displayElement = useWebCodecs ? canvasElement : fallbackVideo;
        if (useWebCodecs) {
            canvasElement.classList.remove('is-hidden');
            fallbackVideo.classList.remove('is-active');
        } else {
            canvasElement.classList.add('is-hidden');
            fallbackVideo.classList.add('is-active');
        }

        let input = null;
        let frameCount = 0;
        let audioFrameCount = 0;
        let iconsBound = false;
        let mediaConnected = false;
        let controlConnected = false;
        let audioUnlocked = false;
        let sessionToken = null;
        let mediaWs = null;
        let controlWs = null;
        let connectionGeneration = 0;
        let mediaWidth = 0;
        let mediaHeight = 0;
        // 被其他设备顶替后进入“礼貌让出”状态：停止一切自动重连，显示提示，
        // 直到用户点“重新接管”才重连（反过来把对方顶下）。避免两端互相反复踢。
        const WS_CLOSE_SUPERSEDED = 4009;
        let supersededYielded = false;

        // Declared before requestAudioUnlock (used by toolbar / gesture handlers).
        // Safari / iOS 17+ use WebCodecs AudioDecoder — stay on WebAudio, no JMuxer fallback.
        const ua = navigator.userAgent || '';
        const isIOS = /iPhone|iPad|iPod/i.test(ua)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isSafari = (/Safari/i.test(ua) || isIOS)
            && !/Chrome|Chromium|CriOS|FxiOS|EdgiOS/i.test(ua);
        const isAndroidMobile = /Android/i.test(ua) && /Mobile/i.test(ua);
        const webAudioAvailable = AacWebAudioPlayer.isSupported();
        const preferElementAudio = !webAudioAvailable
            || (isAndroidMobile && !isDesktopView);
        let useWebAudio = audioEnabled && !preferElementAudio && webAudioAvailable;
        let webAudioPlayer = useWebAudio ? new AacWebAudioPlayer() : null;
        if (webAudioPlayer && isSafari) {
            webAudioPlayer.setKeeperElement(audioElement);
        }
        if (useWebAudio && !isSafari) {
            audioElement.muted = true;
            audioElement.pause();
        } else if (!useWebAudio) {
            audioElement.muted = false;
        }
        let audioJmuxer = null;
        let lastAudioCatchupAt = 0;
        let lastAudioPlayAttemptAt = 0;

        function ensureAudioJmuxer() {
            if (!audioEnabled || audioJmuxer) {
                return audioJmuxer;
            }
            audioJmuxer = new JMuxer({
                node: 'audio-player',
                mode: 'audio',
                flushingTime: isIOS ? 100 : 50,
                clearBuffer: !isIOS,
                maxDelay: isIOS ? 2800 : 1200,
                debug: false,
                onReady: () => console.log('audio player ready (jmuxer)', isIOS ? 'ios' : 'default'),
                onError: (err) => console.error('Audio JMuxer error:', err)
            });
            return audioJmuxer;
        }

        function aacFrameDurationMs(audioConfig) {
            const parsed = AudioParser.parseAudioSpecificConfig(audioConfig);
            const rates = [96000, 88200, 64000, 48000, 44100, 32000, 24000, 22050, 16000, 12000, 11025, 8000, 7350];
            const rate = rates[parsed.samplingFrequencyIndex] || 48000;
            return Math.round(1024 / rate * 1000);
        }

        function requestAudioUnlock() {
            if (!audioEnabled) {
                return;
            }
            if (useWebAudio && webAudioPlayer) {
                try {
                    if (navigator.audioSession) {
                        navigator.audioSession.type = 'ambient';
                    }
                } catch (e) {}
                webAudioPlayer.unlockSync();
                const first = !audioUnlocked;
                audioUnlocked = true;
                if (first) {
                    showKeyboardHint('声音已映射到本机');
                }
                webAudioPlayer.unlock().then((ok) => {
                    if (!ok) {
                        console.warn('WebAudio unlock pending — tap again if still silent');
                    }
                });
                return;
            }
            if (audioElement) {
                audioElement.muted = false;
                audioElement.volume = 1;
                const playPromise = audioElement.play();
                if (playPromise && typeof playPromise.then === 'function') {
                    playPromise.then(() => {
                        const first = !audioUnlocked;
                        audioUnlocked = true;
                        if (first) {
                            showKeyboardHint('声音已映射到本机');
                        }
                    }).catch((e) => console.warn('audio element play:', e));
                } else {
                    audioUnlocked = true;
                }
            }
        }

        function resumeAudioIfNeeded() {
            if (!audioEnabled || document.hidden) {
                return;
            }
            if (useWebAudio && webAudioPlayer) {
                webAudioPlayer.resume().then((ok) => {
                    if (ok) {
                        audioUnlocked = true;
                    }
                }).catch(() => {});
                return;
            }
            if (audioElement && audioUnlocked) {
                audioElement.muted = false;
                audioElement.play().catch(() => {});
            }
        }

        function createKeyPacket(action, keycode) {
            const buffer = new ArrayBuffer(14);
            const view = new DataView(buffer);
            view.setUint8(0, 0);
            view.setUint8(1, action);
            view.setInt32(2, keycode, false);
            view.setInt32(6, 0, false);
            view.setInt32(10, 0, false);
            return new Uint8Array(buffer);
        }

        function emitControl(data) {
            if (!controlWs || controlWs.readyState !== WebSocket.OPEN) {
                if (mediaConnected && sessionToken && isSocketOpen(mediaWs)) {
                    if (isSocketBusy(controlWs)) {
                        return false;
                    }
                    scheduleEnsureConnections(50);
                    updateStatus('控制通道未连接，正在重连…');
                    return false;
                }
                if (mediaConnected || lastPresentedAt || lastMediaPacketAt) {
                    forceReconnect('control missing on input', { bypassCooldown: true });
                } else {
                    scheduleEnsureConnections(50);
                }
                if (!controlWs || controlWs.readyState !== WebSocket.OPEN) {
                    return false;
                }
            }
            try {
                controlWs.send(data instanceof ArrayBuffer ? data : new Uint8Array(data));
                return true;
            } catch (err) {
                console.warn('control send failed:', err);
                try { controlWs.close(); } catch (e) {}
                controlWs = null;
                controlConnected = false;
                scheduleEnsureConnections(50);
                return false;
            }
        }

        function sendKeyPress(keycode) {
            const okDown = emitControl(createKeyPacket(0, keycode));
            const okUp = emitControl(createKeyPacket(1, keycode));
            return okDown && okUp;
        }

        function toggleLockScreen() {
            sendKeyPress(26);
        }

        function updateAudioToggleIcon() {
            const symbol = document.getElementById('audio-toggle-symbol');
            const btn = document.getElementById('audio-toggle-icon');
            if (!symbol || !btn) {
                return;
            }
            if (audioEnabled) {
                symbol.innerHTML = '<use href="#i-vol-on"/>';
                btn.title = '声音已映射到本机（点击关闭）';
                btn.setAttribute('data-tip', '声音已映射到本机');
                btn.classList.add('is-active');
            } else {
                symbol.innerHTML = '<use href="#i-vol-off"/>';
                btn.title = '开启本机声音映射';
                btn.setAttribute('data-tip', '开启本机声音');
                btn.classList.remove('is-active');
            }
        }

        // Quality/audio switches reload the page. Before reloading: (1) mark so
        // the reloaded page skips the disguise gate, and (2) tell the server not
        // to auto-lock the phone during this switch teardown.
        function reloadForSwitch() {
            try { sessionStorage.setItem('scrcpySkipGate', '1'); } catch (e) {}
            // 重载前定格当前画面，重载后贴回，遮住整页重建的黑屏空档。
            captureSwitchSnapshot();
            try {
                if (controlWs && controlWs.readyState === WebSocket.OPEN) {
                    controlWs.send('suppress-lock');
                }
            } catch (e) {}
            try {
                if (mediaWs && mediaWs.readyState === WebSocket.OPEN) {
                    mediaWs.send('suppress-lock');
                }
            } catch (e) {}
            // Small delay so the message flushes before the socket closes.
            setTimeout(() => location.reload(), 90);
        }

        function toggleAudioPlayback() {
            const nextEnabled = !audioEnabled;
            // MSE 降级路径或音频管线未建时，用整页重载安全重建（平滑切换只在 WebCodecs 可靠）。
            if (!useWebCodecs || (nextEnabled && !audioParser)) {
                saveAudioEnabled(nextEnabled);
                reloadForSwitch();
                return;
            }
            // 常规情况：管线已存在，平滑切换（不重载、不黑屏，保留最后一帧）。
            audioEnabled = nextEnabled;
            saveAudioEnabled(nextEnabled);
            updateAudioToggleIcon();
            if (audioEnabled) {
                requestAudioUnlock();
                showKeyboardHint('声音已开启');
            } else {
                showKeyboardHint('声音已关闭');
            }
            showFreezeFrame();
            quietSwitch = true;
            if (quietSwitchTimer) {
                clearTimeout(quietSwitchTimer);
            }
            quietSwitchTimer = setTimeout(() => {
                quietSwitch = false;
                quietSwitchTimer = null;
                if (!screenReady) {
                    hideFreezeFrame();
                    showScreenLoader('正在切换', '重新拉流…');
                }
            }, 12000);
            forceReconnect('audio toggle ' + (nextEnabled ? 'on' : 'off'),
                { bypassCooldown: true, force: true });
        }

        function updateKeyboardToggleIcon() {
            const btn = document.getElementById('keyboard-toggle-icon');
            if (!btn) {
                return;
            }
            btn.style.display = '';
            // 两个开关互相独立：短按管本机键盘，长按管手机输入法，可同时开。
            const deviceIme = inputMode === 'device';
            btn.title = '本机键盘' + (keyboardEnabled ? '开' : '关')
                + ' / 手机输入法' + (deviceIme ? '开' : '关')
                + '（点击开关本机键盘，长按开关手机输入法）';
            if (keyboardEnabled && deviceIme) {
                btn.setAttribute('data-tip', '双键盘');
            } else if (deviceIme) {
                btn.setAttribute('data-tip', '手机输入法');
            } else {
                btn.setAttribute('data-tip', keyboardEnabled ? '键盘开' : '键盘关');
            }
            btn.classList.toggle('is-active', keyboardEnabled || deviceIme);
        }

        function getKeyboardMappingHint() {
            if (!isDesktopView || !keyboardEnabled) {
                return '';
            }
            return '键盘映射已开启，点击画面后可打字（支持拼音）';
        }

        function updateInitialKeyboardHint() {
            const hint = getKeyboardMappingHint();
            if (hint) {
                showKeyboardHint(hint);
            }
        }

        function showKeyboardHint(text) {
            if (!keyboardHint) {
                return;
            }
            keyboardHint.textContent = text;
            keyboardHint.classList.add('is-visible');
            clearTimeout(showKeyboardHint._timer);
            showKeyboardHint._timer = setTimeout(() => {
                keyboardHint.classList.remove('is-visible');
            }, 2000);
        }

        function setKeyboardFocused(active) {
            displayElement.classList.toggle('keyboard-focused', active);
            if (deviceFrame) {
                deviceFrame.classList.toggle('kb-focus', active);
            }
        }

        // 把手机自己的输入法开/关同步到设备（长按键盘按钮切换输入方式时调用）。
        function pushDeviceImeMode(useDeviceIme) {
            fetch('/api/ime?on=' + (useDeviceIme ? 1 : 0) + '&ts=' + Date.now(),
                  { cache: 'no-store' })
                .catch(() => {});
        }

        // 长按键盘按钮：在「本机键盘」和「手机输入法」之间切换。
        // 长按键盘按钮：单独开关“手机自己的输入法”。它和本机键盘互相独立——
        // 两个都开时，点手机上的输入框会弹出手机输入法，而本机键盘一直在，
        // 于是两套键盘同时可用（看拼音候选用手机的，快速打字用本机的）。
        function toggleInputMode() {
            inputMode = inputMode === 'device' ? 'local' : 'device';
            saveInputMode(inputMode);
            updateKeyboardToggleIcon();
            if (inputMode === 'device') {
                pushDeviceImeMode(true);
                showKeyboardHint('手机输入法已开：点手机上的输入框即可弹出');
            } else {
                pushDeviceImeMode(false);
                showKeyboardHint('手机输入法已关：只用本机键盘');
            }
        }

        function toggleKeyboardInput() {
            keyboardEnabled = !keyboardEnabled;
            saveKeyboardEnabled(keyboardEnabled);
            updateKeyboardToggleIcon();
            if (!isDesktopView) {
                // Mobile: summon the system keyboard via the hidden textarea.
                if (keyboardEnabled) {
                    activateMobileKeyboard();
                    showKeyboardHint('键盘已开启，直接输入即可');
                } else {
                    deactivateMobileKeyboard();
                    showKeyboardHint('键盘已关闭');
                }
                return;
            }
            if (input) {
                input.setKeyboardMappingEnabled(keyboardEnabled);
                if (keyboardEnabled) {
                    input.ensureKeyboardInputFocused();
                }
            }
            const hint = getKeyboardMappingHint();
            if (hint) {
                showKeyboardHint(hint);
            } else {
                showKeyboardHint('键盘映射已关闭');
            }
        }

        // —— Mobile keyboard: ScrcpyInput skips keyboard binding on touch
        // devices, so drive a hidden contenteditable surface here and reuse
        // the packet builders on the input instance. A contenteditable div
        // (not a form field) keeps Chrome/iOS from showing the autofill bar
        // (password / card / address buttons) above the keyboard. ——
        const mobileKbSurface = document.getElementById('mobile-kb-surface') || mobileKeyboardInput;
        let mobileKbBound = false;
        let mobileKbComposing = false;

        function mobileKbRead() {
            return mobileKbSurface.isContentEditable
                ? (mobileKbSurface.textContent || '')
                : (mobileKbSurface.value || '');
        }

        function mobileKbClear() {
            if (mobileKbSurface.isContentEditable) {
                mobileKbSurface.textContent = '';
            } else {
                mobileKbSurface.value = '';
            }
        }

        function bindMobileKeyboard() {
            if (mobileKbBound || !mobileKbSurface) {
                return;
            }
            mobileKbBound = true;
            const el = mobileKbSurface;
            el.addEventListener('compositionstart', () => {
                mobileKbComposing = true;
            });
            el.addEventListener('compositionend', (event) => {
                mobileKbComposing = false;
                const committed = event.data || mobileKbRead();
                if (committed && input) {
                    input.sendText(committed);
                }
                mobileKbClear();
            });
            el.addEventListener('input', (event) => {
                if (mobileKbComposing) {
                    return;
                }
                if (event.inputType === 'deleteContentBackward') {
                    if (input) {
                        input.sendKeyCode(null, 0, 67);
                        input.sendKeyCode(null, 1, 67);
                    }
                    mobileKbClear();
                    return;
                }
                const value = mobileKbRead();
                if (event.inputType === 'insertLineBreak'
                    || event.inputType === 'insertParagraph'
                    || value === '\n') {
                    if (input) {
                        input.sendKeyCode(null, 0, 66);
                        input.sendKeyCode(null, 1, 66);
                    }
                    mobileKbClear();
                    return;
                }
                if (value && input) {
                    input.sendText(value);
                }
                mobileKbClear();
            });
            el.addEventListener('keydown', (event) => {
                if (event.isComposing || event.keyCode === 229) {
                    return;
                }
                if (event.key === 'Enter') {
                    event.preventDefault();
                    if (input) {
                        input.sendKeyCode(null, 0, 66);
                        input.sendKeyCode(null, 1, 66);
                    }
                    mobileKbClear();
                } else if (event.key === 'Backspace' && !mobileKbRead()) {
                    if (input) {
                        input.sendKeyCode(null, 0, 67);
                        input.sendKeyCode(null, 1, 67);
                    }
                }
            });
            el.addEventListener('blur', () => {
                // User dismissed the system keyboard — reflect it on the button.
                if (!isDesktopView && keyboardEnabled) {
                    keyboardEnabled = false;
                    saveKeyboardEnabled(false);
                    updateKeyboardToggleIcon();
                }
            });
        }

        function activateMobileKeyboard() {
            if (!mobileKbSurface) {
                return;
            }
            bindMobileKeyboard();
            mobileKbClear();
            // Must run inside the tap gesture for iOS to show the keyboard.
            mobileKbSurface.focus();
        }

        function deactivateMobileKeyboard() {
            if (!mobileKbSurface) {
                return;
            }
            mobileKbClear();
            mobileKbSurface.blur();
        }

        function bindIconPressFeedback(el) {
            const press = () => el.classList.add('is-pressed');
            const release = () => el.classList.remove('is-pressed');
            el.addEventListener('pointerdown', press);
            el.addEventListener('pointerup', release);
            el.addEventListener('pointercancel', release);
            el.addEventListener('pointerleave', release);
        }

        function applyQualityPreset(preset) {
            if (!QUALITY_PRESETS[preset] || preset === qualityPreset) {
                if (qualitySelect) {
                    qualitySelect.value = qualityPreset;
                }
                syncQualitySeg();
                return;
            }
            saveQualityPreset(preset);
            qualityPreset = preset;
            qualityConfig = QUALITY_PRESETS[preset];
            syncQualitySeg();
            applyPlayerLatencyTuning();
            setConnectionState('reconnecting', '切换画质…');
            showKeyboardHint('已切换为「' + qualityConfig.label + '」');
            // 平滑切换只在 WebCodecs 路径可靠；MSE 降级路径换流后视频元素不易恢复，
            // 改用整页重载（那条路径本来就这么工作，稳妥）。
            if (!useWebCodecs) {
                reloadForSwitch();
                return;
            }
            // 平滑切换：不重载页面，后台重连新画质。切换瞬间定格最后一帧盖住画布，
            // 遮住手机端 scrcpy 重启的空档，全程不闪黑、不弹加载页。
            showFreezeFrame();
            quietSwitch = true;
            if (quietSwitchTimer) {
                clearTimeout(quietSwitchTimer);
            }
            // 兜底：手机端重启偶尔较慢，给足 12 秒；仍无新画面才认定异常、退回加载页。
            quietSwitchTimer = setTimeout(() => {
                quietSwitch = false;
                quietSwitchTimer = null;
                if (!screenReady) {
                    hideFreezeFrame();
                    showScreenLoader('正在切换画质', '重新拉流…');
                }
            }, 12000);
            forceReconnect('quality switch to ' + preset, { bypassCooldown: true, force: true });
        }

        function closeToolsPanel() {
            const root = document.querySelector('.app');
            if (root) {
                root.classList.remove('tools-open');
            }
        }

        // —— 截屏：触发谷歌2手机自带的系统截屏，图片保存在手机自己的相册里。——
        let screenshotBusy = false;
        function takeScreenshot() {
            if (screenshotBusy) {
                return;
            }
            screenshotBusy = true;
            showKeyboardHint('正在截屏…');
            fetch('/api/screenshot?ts=' + Date.now(), { cache: 'no-store' })
                .then((resp) => resp.json().catch(() => ({ ok: resp.ok })))
                .then((data) => {
                    if (data && data.ok) {
                        showKeyboardHint('已截屏，保存到手机相册');
                    } else {
                        showKeyboardHint('截屏失败');
                    }
                })
                .catch((e) => {
                    console.warn('screenshot failed:', e);
                    showKeyboardHint('截屏失败，请确认已连接手机');
                })
                .finally(() => {
                    screenshotBusy = false;
                });
        }

        function bindToolbarIcons() {
            if (iconsBound) {
                return;
            }
            iconsBound = true;

            document.querySelectorAll('.icon-btn').forEach(bindIconPressFeedback);

            document.getElementById('power-icon').addEventListener('click', (event) => {
                event.preventDefault();
                requestAudioUnlock();
                toggleLockScreen();
                closeToolsPanel();
                event.currentTarget.blur();
            });

            document.getElementById('audio-toggle-icon').addEventListener('click', (event) => {
                event.preventDefault();
                // If already enabled, this click is a good unlock gesture before reload-off.
                if (audioEnabled) {
                    requestAudioUnlock();
                }
                toggleAudioPlayback();
                event.currentTarget.blur();
            });

            // 键盘按钮：短按 = 开关本机键盘；长按 = 切换「本机键盘 / 手机输入法」。
            const kbBtn = document.getElementById('keyboard-toggle-icon');
            let kbPressTimer = null;
            let kbLongFired = false;
            const kbCancelPress = () => {
                if (kbPressTimer) {
                    clearTimeout(kbPressTimer);
                    kbPressTimer = null;
                }
            };
            kbBtn.addEventListener('pointerdown', () => {
                kbLongFired = false;
                kbCancelPress();
                kbPressTimer = setTimeout(() => {
                    kbPressTimer = null;
                    kbLongFired = true;
                    toggleInputMode();
                    closeToolsPanel();
                }, 650);
            });
            kbBtn.addEventListener('pointerup', kbCancelPress);
            kbBtn.addEventListener('pointercancel', () => {
                kbCancelPress();
                kbLongFired = false;
            });
            kbBtn.addEventListener('pointerleave', kbCancelPress);
            kbBtn.addEventListener('click', (event) => {
                event.preventDefault();
                if (kbLongFired) {          // 长按已处理，忽略随后的 click
                    kbLongFired = false;
                    event.currentTarget.blur();
                    return;
                }
                requestAudioUnlock();
                toggleKeyboardInput();
                closeToolsPanel();
                event.currentTarget.blur();
            });

            const screenshotBtn = document.getElementById('screenshot-icon');
            if (screenshotBtn) {
                screenshotBtn.addEventListener('click', (event) => {
                    event.preventDefault();
                    takeScreenshot();
                    closeToolsPanel();
                    event.currentTarget.blur();
                });
            }

            if (qualitySelect) {
                qualitySelect.addEventListener('change', (event) => {
                    applyQualityPreset(event.target.value);
                });
            }

            if (qualitySeg) {
                qualitySeg.querySelectorAll('button').forEach((btn) => {
                    btn.addEventListener('click', (event) => {
                        event.preventDefault();
                        applyQualityPreset(btn.dataset.q);
                    });
                });
            }

            function bindKeyIcon(id, keycode) {
                const el = document.getElementById(id);
                if (!el) {
                    return;
                }
                el.addEventListener('click', (event) => {
                    event.preventDefault();
                    requestAudioUnlock();
                    sendKeyPress(keycode);
                    event.currentTarget.blur();
                });
            }

            bindKeyIcon('volume-down-icon', 25);
            bindKeyIcon('volume-up-icon', 24);
            bindKeyIcon('back-icon', 4);
            bindKeyIcon('home-icon', 3);
            bindKeyIcon('menu-icon', 187);

            // Mobile floating tools button: draggable; a tap (no drag) toggles
            // the panel, which pops up next to wherever the ball sits.
            const fabTools = document.getElementById('fab-tools');
            const appRoot = document.querySelector('.app');
            if (fabTools && appRoot) {
                // 换了默认位置（右侧边缘居中），把旧的拖动记录一次性作废：
                // 换 key 即可让老浏览器回到新默认，之后拖动照常记住。
                const FAB_POS_KEY = 'fabToolsPos2';
                try { localStorage.removeItem('fabToolsPos'); } catch (e) {}
                const fabPanel = document.querySelector('.topbar');
                const FAB_MARGIN = 8;

                function applyFabPos(left, top) {
                    const w = fabTools.offsetWidth || 48;
                    const h = fabTools.offsetHeight || 48;
                    // 夹在投屏画面内，拖不进两侧黑边
                    const b = fabBounds(Math.max(w, h), FAB_MARGIN);
                    if (b.maxX < b.minX || b.maxY < b.minY) { return; }
                    const x = Math.min(Math.max(left, b.minX), b.maxX);
                    const y = Math.min(Math.max(top, b.minY), b.maxY);
                    fabTools.style.left = x + 'px';
                    fabTools.style.top = y + 'px';
                    fabTools.style.right = 'auto';
                    fabTools.style.bottom = 'auto';
                }

                function saveFabPos() {
                    const rect = fabTools.getBoundingClientRect();
                    try {
                        localStorage.setItem(FAB_POS_KEY, JSON.stringify({
                            xr: rect.left / window.innerWidth,
                            yr: rect.top / window.innerHeight,
                        }));
                    } catch (e) {}
                }

                function loadFabPos() {
                    try {
                        const saved = JSON.parse(localStorage.getItem(FAB_POS_KEY) || 'null');
                        if (saved && isFinite(saved.xr) && isFinite(saved.yr)) {
                            applyFabPos(saved.xr * window.innerWidth, saved.yr * window.innerHeight);
                        }
                    } catch (e) {}
                }

                function placePanelNearFab() {
                    if (!fabPanel) {
                        return;
                    }
                    const fr = fabTools.getBoundingClientRect();
                    const pw = fabPanel.offsetWidth || 260;
                    const ph = fabPanel.offsetHeight || 150;
                    const left = Math.min(
                        Math.max(fr.right - pw, FAB_MARGIN),
                        window.innerWidth - pw - FAB_MARGIN
                    );
                    let top = fr.top - ph - FAB_MARGIN;
                    if (top < FAB_MARGIN) {
                        top = Math.min(fr.bottom + FAB_MARGIN, window.innerHeight - ph - FAB_MARGIN);
                    }
                    fabPanel.style.left = left + 'px';
                    fabPanel.style.top = top + 'px';
                    fabPanel.style.right = 'auto';
                    fabPanel.style.bottom = 'auto';
                }

                let dragPointerId = null;
                let dragMoved = false;
                let dragStartX = 0;
                let dragStartY = 0;
                let dragOrigLeft = 0;
                let dragOrigTop = 0;

                let longPressTimer = null;
                let longPressFired = false;

                fabTools.addEventListener('pointerdown', (event) => {
                    dragPointerId = event.pointerId;
                    dragMoved = false;
                    longPressFired = false;
                    const rect = fabTools.getBoundingClientRect();
                    dragStartX = event.clientX;
                    dragStartY = event.clientY;
                    dragOrigLeft = rect.left;
                    dragOrigTop = rect.top;
                    try { fabTools.setPointerCapture(event.pointerId); } catch (e) {}
                    // Long-press (hold ~650ms without moving) opens diagnostics.
                    if (longPressTimer) {
                        clearTimeout(longPressTimer);
                    }
                    longPressTimer = setTimeout(() => {
                        longPressTimer = null;
                        if (dragMoved) {
                            return;
                        }
                        longPressFired = true;
                        appRoot.classList.remove('tools-open');
                        showDiagnostics();
                    }, 650);
                });

                fabTools.addEventListener('pointermove', (event) => {
                    if (dragPointerId !== event.pointerId) {
                        return;
                    }
                    const dx = event.clientX - dragStartX;
                    const dy = event.clientY - dragStartY;
                    if (!dragMoved && Math.abs(dx) < 6 && Math.abs(dy) < 6) {
                        return;
                    }
                    if (!dragMoved) {
                        dragMoved = true;
                        appRoot.classList.remove('tools-open');
                        if (longPressTimer) {
                            clearTimeout(longPressTimer);
                            longPressTimer = null;
                        }
                    }
                    applyFabPos(dragOrigLeft + dx, dragOrigTop + dy);
                    event.preventDefault();
                });

                const endFabDrag = (event) => {
                    if (dragPointerId !== event.pointerId) {
                        return;
                    }
                    dragPointerId = null;
                    if (longPressTimer) {
                        clearTimeout(longPressTimer);
                        longPressTimer = null;
                    }
                    if (dragMoved) {
                        saveFabPos();
                    }
                };
                fabTools.addEventListener('pointerup', endFabDrag);
                fabTools.addEventListener('pointercancel', endFabDrag);

                fabTools.addEventListener('click', (event) => {
                    event.preventDefault();
                    if (dragMoved) {
                        // This click is the tail of a drag — not a toggle.
                        dragMoved = false;
                        return;
                    }
                    if (longPressFired) {
                        // The press already opened diagnostics; don't also toggle.
                        longPressFired = false;
                        return;
                    }
                    requestAudioUnlock();
                    if (!appRoot.classList.contains('tools-open')) {
                        placePanelNearFab();
                    }
                    appRoot.classList.toggle('tools-open');
                });

                window.addEventListener('resize', () => {
                    if (fabTools.style.left) {
                        const rect = fabTools.getBoundingClientRect();
                        applyFabPos(rect.left, rect.top);
                    }
                    if (appRoot.classList.contains('tools-open')) {
                        placePanelNearFab();
                    }
                });

                document.addEventListener('pointerdown', (event) => {
                    if (!appRoot.classList.contains('tools-open')) {
                        return;
                    }
                    if (fabTools.contains(event.target)) {
                        return;
                    }
                    if (fabPanel && fabPanel.contains(event.target)) {
                        return;
                    }
                    appRoot.classList.remove('tools-open');
                }, true);

                loadFabPos();
            }
        }

        bindToolbarIcons();
        updateAudioToggleIcon();
        updateKeyboardToggleIcon();
        updateInitialKeyboardHint();

        function naluForJmuxer(nalu) {
            if (nalu.length < 5) {
                return nalu;
            }
            if (nalu[0] === 0 && nalu[1] === 0 && (nalu[2] === 1 || (nalu[2] === 0 && nalu[3] === 1))) {
                return nalu;
            }
            const len = ((nalu[0] << 24) | (nalu[1] << 16) | (nalu[2] << 8) | nalu[3]) >>> 0;
            if (len + 4 === nalu.length) {
                const out = new Uint8Array(4 + len);
                out[0] = 0;
                out[1] = 0;
                out[2] = 0;
                out[3] = 1;
                out.set(nalu.subarray(4), 4);
                return out;
            }
            return nalu;
        }

        const canvasPlayer = useWebCodecs ? new H264CanvasPlayer(canvasElement) : null;
        let jmuxer = null;
        let pendingVideoSentAt = 0;

        // 切换瞬间的画面快照盖在画布上，避免画布因重配分辨率而闪黑、也不弹加载页。
        const freezeFrameImg = document.getElementById('freeze-frame');
        function showFreezeFrame() {
            if (!freezeFrameImg || !canvasElement) {
                return;
            }
            // 画布还没有有效画面（宽高为 0）就没什么可定格的，直接跳过。
            if (!canvasElement.width || !canvasElement.height) {
                return;
            }
            try {
                freezeFrameImg.src = canvasElement.toDataURL('image/jpeg', 0.85);
                freezeFrameImg.classList.add('is-active');
            } catch (e) {
                // 极少数情况下 canvas 被判定为 tainted，无法导出，此时安静放弃。
                console.warn('freeze-frame snapshot failed:', e);
            }
        }
        function hideFreezeFrame() {
            if (!freezeFrameImg) {
                return;
            }

        // 存进 sessionStorage，重载后立刻贴回定格层——这样电脑端切换也不再黑屏/弹加载页。
        const FREEZE_SNAP_KEY = 'scrcpyFreezeSnap';
        function captureSwitchSnapshot() {
            try {
                let dataUrl = null;
                if (useWebCodecs && canvasElement && canvasElement.width && canvasElement.height) {
                    dataUrl = canvasElement.toDataURL('image/jpeg', 0.8);
                } else if (fallbackVideo && fallbackVideo.videoWidth && fallbackVideo.videoHeight) {
                    const c = document.createElement('canvas');
                    c.width = fallbackVideo.videoWidth;
                    c.height = fallbackVideo.videoHeight;
                    c.getContext('2d').drawImage(fallbackVideo, 0, 0, c.width, c.height);
                    dataUrl = c.toDataURL('image/jpeg', 0.8);
                }
                if (dataUrl) {
                    sessionStorage.setItem(FREEZE_SNAP_KEY, dataUrl);
                }
            } catch (e) {
                // toDataURL 可能因跨源污染失败，或存储超限；安静忽略。
                console.warn('capture switch snapshot failed:', e);
            }
        }
        // 返回 true 表示成功贴回了上一帧快照（调用方据此跳过加载页）。
        function restoreSwitchSnapshot() {
            if (!freezeFrameImg) {
                return false;
            }
            let dataUrl = null;
            try {
                dataUrl = sessionStorage.getItem(FREEZE_SNAP_KEY);
                sessionStorage.removeItem(FREEZE_SNAP_KEY);
            } catch (e) {
                return false;
            }
            if (!dataUrl) {
                return false;
            }
            freezeFrameImg.src = dataUrl;
            freezeFrameImg.classList.add('is-active');
            return true;
        }

        function applyPlayerLatencyTuning() {

                fps: qualityConfig.jmuxerFps,
                clearBuffer: true,
                maxDelay: qualityConfig.maxDelay,

        function toUint8Array(data) {
            if (data instanceof Uint8Array) return data;
            if (data instanceof ArrayBuffer) return new Uint8Array(data);
            if (ArrayBuffer.isView(data)) return new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
            if (Array.isArray(data)) return Uint8Array.from(data);
            if (data && data.data) return Uint8Array.from(data.data);
            return new Uint8Array(data);
        }

        function updateStatus(text) {
            const status = document.getElementById('status');
            if (status) {
                status.style.display = 'block';
                status.textContent = text;
            }

            const lower = String(text || '').toLowerCase();
            if (lower.indexOf('error') !== -1 || text.indexOf('离线') !== -1) {
                setConnectionState('offline', '连接异常');
            } else if (
                text.indexOf('连接已断开') !== -1
                || text.indexOf('重新连接') !== -1
                || text.indexOf('正在重连') !== -1
                || text.indexOf('会话失效') !== -1
            ) {
                setConnectionState('reconnecting', '重新连接…');
            } else if (
                lower.indexOf('connecting') !== -1
                || text.indexOf('正在连接') !== -1
            ) {

        function syncDeviceAspect(width, height) {
            if (!width || !height) {

            document.documentElement.style.setProperty('--device-ar-ratio', String(width / height));
        }

        function frameChromeMetrics(frameW) {
            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            if (isMobile) {
                return { radius: 0, bezel: 0 };
            }
            const radius = Math.max(8, Math.min(12, Math.round(frameW * 0.026)));
            const bezel = Math.max(2, Math.min(3, Math.round(frameW * 0.006)));
            return { radius, bezel };

        // 设备识别：/api/whoami 给 <html> 打型号标记（data-device-model）。

        const TARGET_MODEL = 'PLS120';
        let deviceModel = '';
        let isTargetDevice = false;

        function layoutDeviceFrame() {
            const wrapper = videoWrapper;
            const frame = deviceFrame;
            if (!wrapper || !frame) {
                return;
            }
            const vw = mediaWidth || 0;
            const vh = mediaHeight || 0;
            if (vw <= 0 || vh <= 0) {
                return;
            }
            const ar = vw / vh;
            const wrapperStyle = getComputedStyle(wrapper);
            const padX = parseFloat(wrapperStyle.paddingLeft) + parseFloat(wrapperStyle.paddingRight);
            const padY = parseFloat(wrapperStyle.paddingTop) + parseFloat(wrapperStyle.paddingBottom);
            const availW = wrapper.clientWidth - padX;
            const availH = wrapper.clientHeight - padY;
            if (availW < 16 || availH < 16) {
                return;
            }

            let frameW = availW;
            let frameH = Math.round(frameW / ar);
            if (frameH > availH) {
                frameH = availH;
                frameW = Math.round(frameH * ar);
            }

            // 不做任何放大/裁剪：等比完整显示。OPPO 比 iPhone 窄，左右会留一点黑边，
            // 换来的是整块画面完整——顶部电量栏和底部手势栏都在。
            const chrome = frameChromeMetrics(frameW);
            frame.style.setProperty('--device-frame-radius', chrome.radius + 'px');
            frame.style.setProperty('--device-bezel', chrome.bezel + 'px');
            frame.style.width = frameW + 'px';
            frame.style.height = frameH + 'px';
            document.documentElement.style.setProperty('--device-frame-w', frameW + 'px');

                if (canvasPlayer && typeof canvasPlayer._syncDisplaySize === 'function') {
                    canvasPlayer._syncDisplaySize();
                }
                const slot = frame.querySelector('.screen-slot');
                if (slot && fallbackVideo) {
                    fallbackVideo.style.width = '100%';
                    fallbackVideo.style.height = '100%';
                }
                // 画面尺寸定下来后，把落在黑边里的悬浮球拉回画面内
                clampFabIntoScreen(document.getElementById('fab-tools'), 8);
                clampFabIntoScreen(document.getElementById('fab-nav'), 8);
            });
        }

        function syncDisplayLayout(width, height) {
            if (!width || !height) {
                return;
            }
            syncDeviceAspect(width, height);
            layoutDeviceFrame();
        }

        let layoutObserver = null;
        function bindLayoutObserver() {
            if (!videoWrapper || typeof ResizeObserver === 'undefined') {

                layoutDeviceFrame();
            });

        // 谷歌2 或取不到时 isTargetDevice 保持 false，页面维持原始等比贴边，互不影响。
        fetch('/api/whoami').then((r) => (r.ok ? r.json() : null)).then((d) => {
            if (!d) { return; }
            deviceModel = d.model || '';
            if (deviceModel) { document.documentElement.dataset.deviceModel = deviceModel; }
            if (d.serial) { document.documentElement.dataset.deviceSerial = d.serial; }
            isTargetDevice = (deviceModel === TARGET_MODEL);

            layoutDeviceFrame();   // 拿到设备后按机型重排一次
        }).catch(() => {});

        // 就地改属性（不换对象）：qualityConfig 持有同一引用，改完即时生效。
        function applyOppoQuality() {
            const clear = QUALITY_PRESETS.clear;
            if (clear) {
                clear.video_bit_rate = '8000000';
                clear.max_size = '2372';   // OPPO 原生长边，不缩水
            }
            const hd = QUALITY_PRESETS.hd;
            if (hd) {
                hd.video_bit_rate = '4000000';
                hd.max_size = '1600';
            }
            // 均衡上挪到 1080（原来的 800 让给流畅档），码率按像素量等比提到 3Mbps。
            const balanced = QUALITY_PRESETS.balanced;
            if (balanced) {
                balanced.video_bit_rate = '3000000';
                balanced.max_size = '1080';
            }
            // 流畅（内部名 smooth，界面标签“清晰”）接手原均衡的 800 长边；
            // 码率仍保持 1.2Mbps —— 这档的定位就是省带宽。
            const smooth = QUALITY_PRESETS.smooth;
            if (smooth) {
                smooth.max_size = '800';
            }
        }

        function initInput(width, height) {
            mediaWidth = width;
            mediaHeight = height;
            syncDisplayLayout(width, height);
            if (input) {
                input.resizeScreen(width, height);
                input.tryInitialFocus();
                return;
            }

            function input_data_cb(data) {
                emitControl(new Uint8Array(data));
            }

            input = new ScrcpyInput(input_data_cb, displayElement, width, height, {
                wrapperElement: videoWrapper,
                mobileInputElement: mobileKeyboardInput,
                keyboardMappingEnabled: isDesktopView && keyboardEnabled,
                getMediaSize: () => ({ width: mediaWidth || width, height: mediaHeight || height }),
                onUserGesture: requestAudioUnlock,
                onFocusChange: (active) => {
                    setKeyboardFocused(active && keyboardEnabled);
                    if (active && keyboardEnabled && isDesktopView) {
                        showKeyboardHint('可直接打字，支持拼音输入法');
                    }
                }
            });

            input.setKeyboardMappingEnabled(isDesktopView && keyboardEnabled);
            if (isDesktopView && keyboardEnabled) {
                input.ensureKeyboardInputFocused();
            }
        }

        const parser = new VideoParser(({ type, data, pts }) => {
            if (type === 'nalu') {
                frameCount++;
                if (frameCount === 1 || frameCount % 120 === 0) {
                    const w = mediaWidth || (canvasPlayer && canvasPlayer.width) || fallbackVideo.videoWidth || 0;
                    const h = mediaHeight || (canvasPlayer && canvasPlayer.height) || fallbackVideo.videoHeight || 0;
                    updateStatus('connected, frames: ' + frameCount + ' (' + w + 'x' + h + ')');
                }
                if (canvasPlayer) {
                    canvasPlayer.decodeNalu(data, pts, pendingVideoSentAt);
                } else if (jmuxer) {

                    if (!canvasPlayer.configure(data.sps, data.pps)) {

                    }
                } else if (jmuxer) {
                    jmuxer.feed({ video: naluForJmuxer(data.sps) });
                    jmuxer.feed({ video: naluForJmuxer(data.pps) });
                }
            } else if (type === 'screen_size') {
                initInput(data.width, data.height);
            } else if (type === 'size_change') {
                mediaWidth = data.width;
                mediaHeight = data.height;
                syncDisplayLayout(data.width, data.height);
                if (input) {
                    input.resizeScreen(data.width, data.height);
                }
            }
        });

        let audioParser = audioEnabled ? new AudioParser(({ type, data, pts }) => {
            if (type === 'disabled') {
                showKeyboardHint('设备端音频不可用');
                updateStatus('audio disabled by device');

                console.log('audio config received, bytes=', data && data.length);

                    if (!webAudioPlayer.configure(data)) {

                }
            } else if (type === 'frame') {
                audioFrameCount++;
                if (audioFrameCount === 1 && !audioUnlocked && useWebAudio) {
                    showKeyboardHint(isDesktopView ? '点击画面开启声音' : '点一下画面开启声音');
                }
                if (audioFrameCount === 1 || audioFrameCount % 200 === 0) {
                    const ctxState = webAudioPlayer && webAudioPlayer.audioContext
                        ? webAudioPlayer.audioContext.state : 'n/a';
                    console.log('audio frames:', audioFrameCount,
                        'unlocked=', audioUnlocked,
                        'gesture=', !!(webAudioPlayer && webAudioPlayer.isUnlocked()),
                        'ctx=', ctxState,
                        'configured=', !!(webAudioPlayer && webAudioPlayer.configured),
                        'backend=', useWebAudio ? 'webcodecs' : 'jmuxer',
                        'elPaused=', !!(audioElement && audioElement.paused),
                        'elMuted=', !!(audioElement && audioElement.muted));
                }
                if (useWebAudio && webAudioPlayer) {
                    webAudioPlayer.decodeFrame(data, pts);
                }
                if ((!useWebAudio || !webAudioPlayer) && audioParser.audioConfig) {
                    ensureAudioJmuxer();
                    if (!audioJmuxer) {
                        return;
                    }
                    const adts = AudioParser.wrapAdts(data, audioParser.audioConfig);
                    const duration = aacFrameDurationMs(audioParser.audioConfig);
                    audioJmuxer.feed({ audio: adts, duration: duration });
                    const now = Date.now();
                    if (audioElement && audioUnlocked) {
                        audioElement.muted = false;
                        audioElement.volume = 1;
                        if (audioElement.paused && now - lastAudioPlayAttemptAt > 400) {
                            lastAudioPlayAttemptAt = now;
                            audioElement.play().catch(() => {});
                        } else if (!isIOS && !audioElement.paused && now - lastAudioCatchupAt > 3000) {

                                if (buf && buf.length) {

                                    const lag = end - audioElement.currentTime;

        function wsUrl(path, params) {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const qs = new URLSearchParams(params).toString();
            return proto + '//' + location.host + path + (qs ? '?' + qs : '');

        function isSocketOpen(ws) {
            return !!(ws && ws.readyState === WebSocket.OPEN);
        }

        function isSocketBusy(ws) {
            return !!(ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING));
        }

            if (!ws) {
                return;
            }
            try { ws.onopen = null; } catch (e) {}
            try { ws.onmessage = null; } catch (e) {}
            try { ws.onerror = null; } catch (e) {}
            try { ws.onclose = null; } catch (e) {}
            try { ws.close(); } catch (e) {}
        }

        function refreshConnectionChip() {

            }
            if (isSocketOpen(mediaWs) && isSocketOpen(controlWs)) {
                setConnectionState('connected', '已连接');
                return;
            }
            if (isSocketBusy(mediaWs) || isSocketBusy(controlWs)) {
                setConnectionState('connecting', '连接中…');
                return;
            }
            setConnectionState('offline', '未连接');

        let reconnectTimer = null;
        let reconnecting = false;
        let intentionalTeardown = false;

        let quietSwitch = false;
        let quietSwitchTimer = null;
        let lastPresentedAt = 0;
        let lastMediaPacketAt = 0;
        let lastForceReconnectAt = 0;
        let reconnectAttempt = 0;
        let keepaliveTimer = null;
        let stallWatchTimer = null;
        let hiddenAt = 0;

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>IP/DNS</title>
    <meta name="description" content="IP / DNS 网络工具">
    <meta name="theme-color" content="#0E1014">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IP/DNS">
    <meta name="application-name" content="IP/DNS">
    <!-- 图标用的是全新文件名（globe-*），不是 ?v= 查询串：Safari 的 favicon
         数据库按 URL 缓存且经常无视查询串，删标签页也不清。换文件名才是可靠的
         破缓存方式——新 URL 对它来说就是一个从未见过的资源。 -->
    <link rel="manifest" href="/static/site.webmanifest">
    <link rel="icon" href="/static/icons/globe.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/static/icons/globe.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/globe-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/globe-16.png">
    <link rel="apple-touch-icon" href="/static/icons/globe-touch.png">
    <!-- Safari 固定标签页：只认 mask-icon 的单色 SVG，color 决定上色 -->
    <link rel="mask-icon" href="/static/icons/globe-pinned.svg" color="#2D7FF9">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0E1014;
            --bg-elev: #151821;
            --panel: #1A1E28;
            --panel-2: #222733;
            --line: rgba(255, 255, 255, 0.08);
            --line-strong: rgba(255, 255, 255, 0.14);
            --text: #EEF0F4;
            --muted: #8B93A7;
            --faint: #5C6578;
            --accent: #3DDC84;
            --accent-2: #2BB86A;
            --accent-dim: rgba(61, 220, 132, 0.14);
            --accent-glow: rgba(61, 220, 132, 0.35);
            --warn: #FFB020;
            --danger: #FF6B6B;
            --radius: 12px;
            --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
            --topbar-h: 56px;
            --rail-w: 68px;
            /* mobile: fixed tools rail; stage centered in leftover */
            --device-ar: 9 / 19.5;
            --device-ar-ratio: 0.461538;
            --side-w: 56px;
            --nav-h: 56px;
            --frame-nav-gap: 4px;
            --device-frame-radius: 10px;
            --screen-radius: 0px;
            --device-bezel: 3px;
            --safe-b: env(safe-area-inset-bottom, 0px);
            /* Prefer OS safe-area; fall back to Window Controls Overlay titlebar height */
            --safe-t: max(
                env(safe-area-inset-top, 0px),
                env(titlebar-area-height, 0px)
            );
        }

        /* Desktop installed app / PWA: leave room for OS title / status bar */
        @media (min-width: 769px) {
            @media (display-mode: standalone), (display-mode: minimal-ui), (display-mode: window-controls-overlay) {
                :root {
                    --safe-t: max(
                        env(safe-area-inset-top, 0px),
                        env(titlebar-area-height, 0px),
                        32px
                    );
                }
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: "IBM Plex Sans", system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            height: 100vh;
            height: 100dvh;
            touch-action: manipulation;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 90% 55% at 50% -15%, rgba(61, 220, 132, 0.1), transparent 55%),
                radial-gradient(ellipse 50% 40% at 100% 100%, rgba(90, 120, 220, 0.06), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        button { font: inherit; color: inherit; }
        button:focus { outline: none; }
        button:focus-visible {
            outline: 2px solid rgba(61, 220, 132, 0.55);
            outline-offset: 2px;
        }

        .app {
            position: relative;
            z-index: 1;
            height: 100vh;
            height: 100dvh;
            display: grid;
            /* Top safe inset is a separate row so the whole UI shifts below the status bar */
            grid-template-rows: var(--safe-t) var(--topbar-h) 1fr;
            grid-template-areas:
                "safe"
                "top"
                "main";
        }

        .app::before {
            content: "";
            grid-area: safe;
            background: rgba(21, 24, 33, 0.96);
            border-bottom: 1px solid transparent;
            /* Drag region for desktop PWA / Window Controls Overlay */
            -webkit-app-region: drag;
            app-region: drag;
        }

        /* —— topbar —— */
        .topbar {
            grid-area: top;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 14px;
            height: var(--topbar-h);
            border-bottom: 1px solid var(--line);
            background: rgba(21, 24, 33, 0.88);
            backdrop-filter: blur(16px) saturate(1.2);
            -webkit-backdrop-filter: blur(16px) saturate(1.2);
            z-index: 20;
            min-width: 0;
            -webkit-app-region: drag;
            app-region: drag;
        }

        .topbar button,
        .topbar select,
        .topbar .seg,
        .topbar .chip-wrap,
        .topbar .device-chip {
            -webkit-app-region: no-drag;
            app-region: no-drag;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .brand-mark {
            width: 24px;
                height: 24px;
            border-radius: 9px;
            background: transparent;
            color: #07140C;
            display: grid;
            place-items: center;
            overflow: hidden;
            box-shadow: 0 0 0 1px rgba(61, 220, 132, 0.3), 0 6px 16px rgba(61, 220, 132, 0.2);
        }

        .brand-mark img,
        .brand-mark svg {
            width: 24px;
                height: 24px;
            display: block;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.15;
        }

        .brand-text strong {
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .brand-text small {
            font-size: 10px;
            color: var(--faint);
            font-family: "IBM Plex Mono", monospace;
            letter-spacing: 0.04em;
        }

        .device-chip {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 5px 10px 5px 8px;
            border-radius: 999px;
            background: var(--accent-dim);
            border: 1px solid rgba(61, 220, 132, 0.28);
            font-size: 12px;
            font-weight: 500;
            color: var(--accent);
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            max-width: 220px;
            min-width: 0;
        }

        .device-chip[data-state="connecting"],
        .device-chip[data-state="reconnecting"] {
            background: rgba(255, 176, 32, 0.12);
            border-color: rgba(255, 176, 32, 0.35);
            color: var(--warn);
        }

        .device-chip[data-state="offline"] {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
            color: var(--danger);
        }

        .device-chip .pulse {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }

        .device-chip[data-state="connected"] .pulse {
            box-shadow: 0 0 0 0 var(--accent-glow);
            animation: pulse 2.2s ease infinite;
        }

        .device-chip[data-state="connecting"] .pulse,
        .device-chip[data-state="reconnecting"] .pulse {
            animation: blink 1s steps(2) infinite;
        }

        @keyframes pulse {
            70% { box-shadow: 0 0 0 8px transparent; }
            100% { box-shadow: 0 0 0 0 transparent; }
        }

        @keyframes blink { 50% { opacity: 0.25; } }

        .chip-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chip-wrap {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-left: 4px;
        }

        .chip-latency {
            display: none;
            font-family: "IBM Plex Mono", monospace;
            font-size: 13px;
            font-weight: 400;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.02em;
            color: rgba(255, 255, 255, 0.72);
            white-space: nowrap;
            min-width: 6ch;
        }

        .chip-wrap:has(.device-chip[data-state="connected"]) .chip-latency {
            display: inline;
        }

        .grow { flex: 1; min-width: 8px; }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .toolbar-group + .toolbar-group {
            margin-left: 4px;
            padding-left: 10px;
            border-left: 1px solid var(--line);
        }

        /* Desktop: lock button — no longer tied to side rail */
        .toolbar-group.lock {
            margin-left: 4px;
            padding-left: 10px;
            border-left: 1px solid var(--line);
        }

        .seg {
            display: inline-flex;
            background: var(--bg-elev);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 3px;
            gap: 2px;
        }

        .seg button {
            appearance: none;
            border: none;
            background: transparent;
            color: var(--muted);
            font-size: 12px;
            font-weight: 500;
            padding: 6px 11px;
            border-radius: 7px;
            cursor: pointer;
            transition: background 0.15s var(--ease), color 0.15s, box-shadow 0.15s;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }

        .seg button .q-stack { display: none; }
        .seg button .q-row { display: inline; }

        .seg button:hover { color: var(--text); }

        .seg button.active {
            background: var(--panel-2);
            color: var(--text);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        /* hidden native select kept for JS compatibility */
        #quality-select {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .icon-btn {
            appearance: none;
            border: 1px solid var(--line);
            background: var(--panel-2);
            width: 36px;
            height: 44px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            cursor: pointer;
            color: var(--text);
            transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s, box-shadow 0.15s;
            touch-action: manipulation;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        .icon-btn svg {
            width: 17px;
            height: 17px;
            pointer-events: none;
        }

        .icon-btn .icon { pointer-events: none; }

        .icon-btn:hover {
            background: var(--panel);
            border-color: var(--line-strong);
        }

        .icon-btn:active,
        .icon-btn.is-pressed {
            transform: scale(0.93);
            background: rgba(255, 255, 255, 0.08);
        }

        .icon-btn.is-active,
        .icon-btn.is-on {
            background: var(--accent-dim);
            border-color: rgba(61, 220, 132, 0.45);
            color: var(--accent);
            box-shadow: 0 0 0 1px rgba(61, 220, 132, 0.12);
        }

        .icon-btn.danger:hover {
            border-color: rgba(255, 107, 107, 0.45);
            color: var(--danger);
            background: rgba(255, 107, 107, 0.08);
        }

        .icon-btn[data-tip]::after {
            content: attr(data-tip);
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%) translateY(2px);
            background: #0A0C10;
            border: 1px solid var(--line-strong);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            padding: 5px 8px;
            border-radius: 6px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s, transform 0.12s;
            z-index: 40;
        }

        @media (hover: hover) and (pointer: fine) {
            .icon-btn[data-tip]:hover::after {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* —— workspace —— */
        .workspace {
            grid-area: main;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .stage-stack {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            flex: 1 1 0;
            min-height: 0;
            width: 100%;
            gap: var(--frame-nav-gap);
        }

        .video-wrapper {
            position: relative;
            flex: 1 1 0;
            height: auto;
            min-height: 0;
            overflow: hidden;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 24px 6px;
            box-sizing: border-box;
        }

        .device-frame {
            position: relative;
            flex-shrink: 0;
            margin: 0 auto;
            align-self: center;
            background: #0a0a0c;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--device-frame-radius);
            padding: var(--device-bezel);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: box-shadow 0.25s var(--ease), border-color 0.25s var(--ease);
        }

        .device-frame.kb-focus {
            border-color: rgba(61, 220, 132, 0.35);
            box-shadow:
                0 0 0 1px rgba(61, 220, 132, 0.18),
                0 8px 24px rgba(0, 0, 0, 0.28);
        }

        .device-notch {
            display: none;
        }

        .screen-slot {
            position: relative;
            flex: 1 1 0;
            width: 100%;
            min-width: 0;
            min-height: 0;
            border-radius: var(--screen-radius);
            overflow: hidden;
            background: #000;
        }


        .screen-loader {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 20px;
            background:
                radial-gradient(ellipse 70% 50% at 50% 40%, rgba(61, 220, 132, 0.1), transparent 60%),
                linear-gradient(180deg, #10141c 0%, #07090d 100%);
            transition: opacity 0.35s var(--ease), visibility 0.35s;
            /* Allow taps to reach the canvas so mobile audio unlock still works */
            pointer-events: none;
        }

        .screen-loader.is-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .screen-loader-phone {
            width: min(42%, 120px);
            aspect-ratio: 9 / 19.5;
            border-radius: 18px;
            border: 2px solid rgba(61, 220, 132, 0.45);
            background: rgba(61, 220, 132, 0.06);
            position: relative;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.04) inset, 0 12px 32px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }

        .screen-loader-phone::before {
            content: "";
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 28%;
            height: 3.5%;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
        }

        .screen-loader-phone::after {
            content: "";
            position: absolute;
            inset: 18% 16% 22%;
            border-radius: 8px;
            background: linear-gradient(
                110deg,
                transparent 25%,
                rgba(61, 220, 132, 0.18) 45%,
                transparent 65%
            );
            background-size: 200% 100%;
            animation: loader-shimmer 1.4s ease-in-out infinite;
        }

        .screen-loader-bars {
            position: absolute;
            left: 50%;
            bottom: 28%;
            transform: translateX(-50%);
            display: flex;
            align-items: flex-end;
            gap: 10px;
            height: 28%;
            z-index: 1;
        }

        .screen-loader-bars span {
            width: 5px;
            border-radius: 3px;
            background: var(--accent);
            animation: loader-bar 0.9s ease-in-out infinite;
        }

        .screen-loader-bars span:nth-child(1) { height: 40%; animation-delay: 0s; }
        .screen-loader-bars span:nth-child(2) { height: 65%; animation-delay: 0.12s; }
        .screen-loader-bars span:nth-child(3) { height: 85%; animation-delay: 0.24s; }
        .screen-loader-bars span:nth-child(4) { height: 55%; animation-delay: 0.36s; }

        .screen-loader-copy {
            text-align: center;
            max-width: 16em;
        }

        .screen-loader-copy strong {
            display: block;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--text);
            margin-bottom: 4px;
        }

        .screen-loader-copy span {
            font-size: 13px;
            color: var(--muted);
            font-family: "IBM Plex Mono", monospace;
        }

        @keyframes loader-shimmer {
            0% { background-position: 120% 0; }
            100% { background-position: -80% 0; }
        }

        @keyframes loader-bar {
            0%, 100% { opacity: 0.35; transform: scaleY(0.7); }
            50% { opacity: 1; transform: scaleY(1); }
        }

        canvas#player,
        video#fallback-player {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 0;
            background: black;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        canvas#player { image-rendering: auto; }

        video#fallback-player {
            object-fit: contain;
            object-position: center;
        }

        video#fallback-player { display: none; }
        video#fallback-player.is-active { display: block; }
        canvas#player.is-hidden { display: none; }

        /* 切换画质/重连时定格的“最后一帧”快照：盖在画布上、加载页之下，
           全程遮住手机端 scrcpy 重启造成的黑屏空档，直到新画面真正出来才隐藏。 */
        #freeze-frame {
            position: absolute;
            inset: 0;
            z-index: 3;
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: none;
            background: #000;
            pointer-events: none;
        }
        #freeze-frame.is-active { display: block; }

        video.hide-controls::-webkit-media-controls { display: none !important; }

        #player:focus,
        #player.keyboard-focused,
        #fallback-player:focus,
        #fallback-player.keyboard-focused {
            outline: none;
        }

        #mobile-keyboard-input,
        #mobile-kb-surface {
            position: fixed;
            top: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            resize: none;
            border: none;
            padding: 0;
            margin: 0;
            color: transparent;
            background: transparent;
            caret-color: transparent;
            pointer-events: none;
            z-index: -1;
            font-size: 16px;
            clip: rect(0, 0, 0, 0);
            overflow: hidden;
        }

        .keyboard-hint {
            position: absolute;
            top: 36px;
            left: 50%;
            transform: translateX(-50%) translateY(-6px);
            z-index: 6;
            font-size: 12px;
            font-weight: 500;
            color: #fff;
            background: rgba(10, 12, 16, 0.82);
            backdrop-filter: blur(10px);
            border: 1px solid var(--line-strong);
            padding: 7px 14px;
            border-radius: 999px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s var(--ease);
            white-space: nowrap;
            max-width: 90%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .keyboard-hint.is-visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #status {
            position: absolute;
            left: 20px;
            bottom: 18px;
            z-index: 5;
            font-family: "IBM Plex Mono", monospace;
            font-size: 10.5px;
            color: var(--muted);
            background: rgba(10, 12, 16, 0.65);
            border: 1px solid var(--line);
            padding: 5px 8px;
            border-radius: 7px;
            backdrop-filter: blur(8px);
            pointer-events: none;
            max-width: calc(100% - 40px);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* —— rail / nav —— */
        .nav-bar {
            flex: 0 0 auto;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: var(--nav-h);
            padding: 0;
            border: none;
            border-top: 1px solid var(--line);
            background: rgba(21, 24, 33, 0.55);
            backdrop-filter: blur(8px);
            flex-shrink: 0;
            position: relative;
            z-index: 2;
        }

        .nav-bar-track {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: stretch;
            width: var(--device-frame-w, auto);
            max-width: 100%;
            height: 100%;
            gap: 0;
        }

        .nav-bar .icon-btn {
            flex: 1;
            width: auto;
            height: 100%;
            border: none;
            border-radius: 0;
            background: transparent;
        }

        .nav-bar .icon-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-bar .icon-btn:active,
        .nav-bar .icon-btn.is-pressed {
            background: rgba(255, 255, 255, 0.08);
            transform: none;
        }

        .nav-bar .icon-btn svg {
            width: 20px;
            height: 20px;
        }

        @media (min-width: 769px) {
            .nav-bar {
                height: 60px;
            }
        }

        .rail-cap {
            display: none;
        }

        /* Floating tools button: mobile only */
        .fab-tools {
            display: none;
        }

        /* 导航悬浮球：默认隐藏，只有 OPPO 的手机版才显示（见下方 media query） */
        .fab-nav {
            display: none;
        }

        /* —— mobile：全屏画面 + 悬浮工具面板 —— */
        @media (max-width: 768px) {
            .app {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr);
                grid-template-areas:
                    "main";
            }

            .app::before {
                display: none;
            }

            .workspace {
                grid-area: main;
                display: flex;
                align-items: center;
                justify-content: center;
                min-width: 0;
                min-height: 0;
                background: #000;
                overflow: hidden;
            }

            /* Keep screen + bottom nav as one column → same width */
            .stage-stack {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                height: 100%;
                width: 100%;
                max-width: 100%;
                min-width: 0;
                max-height: 100%;
                gap: 0;
            }

            .video-wrapper {
                flex: 1 1 0;
                padding: 0;
                min-width: 0;
                min-height: 0;
                width: 100%;
                background: #000;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            /* —— OPPO(PLS120) 专属：谷歌2 等机型不带此标记，不受影响。 —— */
            /* 让出 iPhone 状态栏(灵动岛)/home 指示条安全区，否则 OPPO 顶部电量/Wi-Fi 被灵动岛盖住。 */
            :root[data-device-model="PLS120"] .app {
                grid-template-rows:
                    env(safe-area-inset-top, 0px)
                    minmax(0, 1fr)
                    env(safe-area-inset-bottom, 0px);
                grid-template-areas:
                    "safetop"
                    "main"
                    "safebot";
            }

            /* 隐藏 App 自带的导航栏：OPPO 自己的手势栏(◁ ○ ☰)已显示在投屏画面里，
               两者功能重复。省下的高度全部给画面——画面约放大 7%，左右黑边变窄。 */
            :root[data-device-model="PLS120"] .nav-bar {
                display: none;
            }

            .device-frame {
                background: transparent;
                border: none;
                border-radius: 0;
                padding: 0;
                box-shadow: none;
                margin: 0;
            }

            .device-frame.kb-focus {
                border: none;
                box-shadow: inset 0 0 0 2px rgba(61, 220, 132, 0.42);
            }
            .screen-slot {
                border-radius: var(--screen-radius);
                width: 100%;
                flex: 1 1 0;
                min-height: 0;
            }

            canvas#player,
            video#fallback-player {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }

            /* Topbar becomes a floating tool panel toggled by the FAB */
            .topbar {
                position: fixed;
                right: 10px;
                bottom: calc(76px + var(--safe-b));
                z-index: 30;
                width: auto;
                min-width: 0;
                max-width: calc(100vw - 20px);
                height: auto;
                min-height: 0;
                display: grid;
                grid-template-columns: repeat(5, 54px);
                grid-template-rows: repeat(2, 44px);
                align-items: center;
                justify-content: center;
                align-content: center;
                gap: 8px 6px;
                padding: 24px 8px 10px;
                border: 1px solid var(--line-strong);
                border-radius: 16px;
                background: rgba(14, 16, 20, 0.94);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
                box-sizing: border-box;
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
                transform: translateY(8px) scale(0.98);
                transform-origin: 100% 100%;
                transition: opacity 0.18s var(--ease), transform 0.18s var(--ease), visibility 0.18s;
                -webkit-app-region: no-drag;
                app-region: no-drag;
            }

            .app.tools-open .topbar {
                opacity: 1;
                visibility: visible;
                pointer-events: auto;
                transform: none;
            }

            .fab-tools {
                display: grid;
                place-items: center;
                position: fixed;
                /* 首次进入：贴右侧边缘、垂直居中。用 calc(50% - 半个球高) 而不是
                   transform，避免和拖动时 JS 写入的 left/top 打架。8px 与拖动
                   夹紧用的 FAB_MARGIN 一致，默认位置正好等于能拖到的最右边。 */
                right: 8px;
                top: calc(50% - 24px);
                z-index: 31;
                width: 48px;
                height: 48px;
                padding: 0;
                appearance: none;
                border-radius: 50%;
                border: 1px solid var(--line-strong);
                background: rgba(14, 16, 20, 0.78);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                color: var(--text);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
                -webkit-user-select: none;
                user-select: none;
                /* none (not manipulation): pointermove must win over browser
                   pan/refresh gestures while dragging the ball */
                touch-action: none;
            }

            .fab-tools svg {
                width: 20px;
                height: 20px;
                pointer-events: none;
            }

            /* 导航悬浮球：只有 OPPO 显示。默认停在底部正中——
               球宽 48px，所以左偏移取 calc(50% - 24px) 才是真正居中；
               底部再让开 iPhone 的 home 指示条(safe-area)，免得被横条压住。 */
            :root[data-device-model="PLS120"] .fab-nav {
                display: grid;
                place-items: center;
                position: fixed;
                left: calc(50% - 24px);
                bottom: calc(10px + env(safe-area-inset-bottom, 0px));
                z-index: 31;
                width: 48px;
                height: 48px;
                padding: 0;
                appearance: none;
                /* 只留徽标本身：无圆形底色、无边框、无投影 */
                border: none;
                background: none;
                box-shadow: none;
                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
                -webkit-user-select: none;
                user-select: none;
                touch-action: none;   /* 拖动时 pointermove 要压过浏览器手势 */
            }

            /* 没有底色托着，徽标画大一点才好按（触控区仍是 48×48） */
            .fab-nav-img,
            .fab-nav svg {
                width: 42px;
                height: 42px;
                pointer-events: none;
            }

            .fab-nav-img {
                object-fit: contain;
                display: block;
            }

            /* 有图片时藏起手绘版；图片加载失败会被 onerror 移除，
               那时 SVG 变成第一个子元素，自动显示出来。 */
            .fab-nav-svg { display: none; }
            .fab-nav-svg:first-child { display: block; }

            /* 触发反馈：按下缩一下；命中时用徽标自身的黄色辉光，不用黑影 */
            .fab-nav.is-pressed {
                transform: scale(0.92);
            }

            .fab-nav.is-fired svg {
                filter: drop-shadow(0 0 6px rgba(247, 201, 72, 0.95));
            }

            .app.tools-open .fab-tools {
                background: var(--accent-dim);
                border-color: rgba(61, 220, 132, 0.45);
                color: var(--accent);
            }

            /* QQ / 微信 / Soul 有新消息：悬浮球边缘跑马灯（旋转彩虹光环）。
               只用 transform 旋转一个被遮罩成圆环的小伪元素，GPU 合成、开销极小，
               不影响视频画面。打开对应 App 后由轮询自动摘掉 has-alert，恢复原样。 */
            .fab-tools.has-alert,
            .app.tools-open .fab-tools.has-alert {
                color: #fff;
                overflow: visible;
                background: #0e1014;
                border-color: transparent;
            }

            /* 旋转的彩虹圆盘（transform 旋转，GPU 合成，不碰视频画面） */
            .fab-tools.has-alert::before {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: 50%;
                background: conic-gradient(from 0deg,
                    #ff3b30, #ff9500, #ffd60a, #34c759,
                    #00c7be, #0a84ff, #af52de, #ff2d55, #ff3b30);
                animation: fab-marquee-spin 1.1s linear infinite;
                pointer-events: none;
                z-index: 0;
            }
            /* 中心用实心圆盖住，只露出外圈 = 跑马灯圆环。
               不用 mask —— 避开 Safari 上 mask + backdrop-filter 的渲染 bug。 */
            .fab-tools.has-alert::after {
                content: "";
                position: absolute;
                inset: 4px;
                border-radius: 50%;
                background: #0e1014;
                pointer-events: none;
                z-index: 1;
            }
            /* 图标抬到圆盘之上，不被盖住 */
            .fab-tools.has-alert svg {
                position: relative;
                z-index: 2;
            }

            @keyframes fab-marquee-spin {
                to { transform: rotate(360deg); }
            }

        /* —— Disguise gate: Chrome offline dino page —— */
        .offline-gate {
            /* iOS Safari 断网错误页：浅色白底/深色纯黑，文案为次级标签灰、居上三分之一 */
            --offline-bg: #ffffff;
            --offline-fg: rgba(60, 60, 67, 0.6);
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: var(--offline-bg);
            color: var(--offline-fg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20vh 30px calc(24px + env(safe-area-inset-bottom, 0px));
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                "PingFang SC", "Helvetica Neue", system-ui, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: default;
            /* 禁掉双指缩放/拖动：body 上的 manipulation 只挡双击放大，挡不住捏合。
               投屏区本来就是 touch-action:none，所以正常页面缩放不了；伪装页少了
               这一条才会被放大，两边行为不一致。点击事件不受影响，三下唤醒照常。 */
            touch-action: none;
        }

        @media (prefers-color-scheme: dark) {
            .offline-gate {
                --offline-bg: #000000;
                --offline-fg: rgba(235, 235, 245, 0.6);
            }
        }

        .offline-gate.is-gone {
            display: none;
        }

        .offline-inner {
            max-width: 330px;
            width: 100%;
            text-align: center;
        }

        .offline-message {
            font-size: 18px;
            font-weight: 400;
            line-height: 1.4;
            color: var(--offline-fg);
            margin: 0;
            letter-spacing: 0.1px;
        }

        /* Invisible unlock zone: bottom-right corner, 3 taps to enter */
        .offline-hotspot {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 96px;
            height: 96px;
            z-index: 1;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }

        .paste-text {
            width: 100%;
            appearance: none;
            border: 1px solid var(--line-strong);
            background: #0E1014;
            color: var(--text);
            font-size: 16px;   /* ≥16px 防 iOS 聚焦缩放 */
            line-height: 1.4;
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
            resize: vertical;
        }

        .paste-text:focus {
            border-color: rgba(61, 220, 132, 0.55);
        }

        .paste-actions {
            display: flex;
            gap: 8px;
        }

        .paste-actions .diag-btn {
            flex: 1;
        }

        .diag-text {
            flex: 1;
            width: 100%;
            min-height: 320px;
            resize: none;
            border: none;
            outline: none;
            padding: 12px 16px;
            background: #0E1014;
            color: var(--text);
            font-family: "IBM Plex Mono", monospace;
            /* iOS Safari auto-zooms the page when a focused input/textarea has
               font-size under 16px (it assumes you need to see what you're
               typing). copyDiagnostics() calls ta.focus() to select-and-copy,
               so this must stay >= 16px or every copy tap re-triggers the zoom. */
            font-size: 16px;
            line-height: 1.5;
            white-space: pre;
            overflow: auto;
            -webkit-user-select: text;
            user-select: text;
        }

        /* —— 截屏预览浮层 —— */
        .shot-overlay {
            position: fixed;
            inset: 0;
            z-index: 100001;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .shot-overlay.is-open {
            display: flex;
        }

        .shot-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 92vw;
            max-height: 90vh;
        }

        .shot-img {
            max-width: 100%;
            max-height: 74vh;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid var(--line-strong);
            background: #000;
            -webkit-touch-callout: default;
        }

        .shot-bar {
            display: flex;
            gap: 10px;
        }

        .shot-save,
        .shot-close {
            appearance: none;
            border: 1px solid var(--line-strong);
            font-size: 14px;
            font-weight: 500;
            padding: 9px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
        }

        .shot-save {
            background: var(--accent);
            border-color: var(--accent);
            color: #07140C;
        }

        .shot-close {
            background: var(--panel-2);
            color: var(--text);
        }
    </style>

    <div class="app">
        <header class="topbar">

                    <img src="/static/icons/globe.svg" alt="" width="18" height="18">

                </div>

            <div class="chip-wrap" id="chip-wrap">

                    <span class="chip-label" id="chip-label">正在连接…</span>
                </div>
                <span class="chip-latency" id="chip-latency" title="延迟">-- ms</span>
            </div>

            <div class="grow"></div>

            <div class="toolbar-group">
                <div class="seg" id="quality-seg" role="group" aria-label="画质模式" title="画质模式（切换后会重新连接）">
                    <button type="button" data-q="clear"><span class="q-row">原画</span><span class="q-stack" aria-hidden="true"><span class="q-char">原</span><span class="q-char">画</span></span></button>

                    <button type="button" data-q="smooth"><span class="q-row">清晰</span><span class="q-stack" aria-hidden="true"><span class="q-char">清</span><span class="q-char">晰</span></span></button>

        <!-- 导航悬浮球（仅 OPPO）：手机自己的手势栏已被裁掉、App 导航栏也隐藏了，

                         C13.2 17.7 8.7 17.5 6.9 15.9"

                <path d="M17.4 7.9 C15.4 6.6 9.9 6.5 8.4 8.2

    <!-- Disguise gate: looks like Chrome's offline dino page. Real connection
         is not started until the hidden corner is tapped 3 times. -->
    <div class="offline-gate" id="offline-gate">
        <div class="offline-inner">

    <!-- 锁屏时的 PIN 输入框：OPPO(ColorOS) 的锁屏是 FLAG_SECURE，在投屏里是一整片
         黑屏、看不到密码盘，所以在网页这一侧收 PIN，用盲解锁发进去。 -->
    <div class="pin-gate" id="pin-gate" hidden>
        <div class="pin-card">
            <p class="pin-title">手机已锁屏</p>
            <p class="pin-sub">锁屏画面无法显示，请输入手机 PIN 解锁</p>

                   autocomplete="off" placeholder="手机 PIN" aria-label="手机 PIN" />
            <label class="pin-remember">
                <input type="checkbox" id="pin-gate-remember" /> 记住，下次自动解锁
            </label>
            <div class="pin-actions">
                <button type="button" id="pin-gate-cancel" class="pin-btn">稍后</button>
                <button type="button" id="pin-gate-ok" class="pin-btn pin-btn-primary">解锁</button>
            </div>

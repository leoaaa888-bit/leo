<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!--
    Safari 固定标签页专用（rel="mask-icon"）。
    要求：单色纯黑、背景透明 —— Safari 会用 link 上的 color 给它上色。
    全部用「填充路径」而不是描边，兼容性最稳（描边在 mask-icon 里不保证渲染）。
  -->
  <g fill="#000000">
    <!-- 外圈：两个同心圆 + evenodd 挖空成环 -->
    <path fill-rule="evenodd" d="M1,8 A7,7 0 1,0 15,8 A7,7 0 1,0 1,8 Z M2.1,8 A5.9,5.9 0 1,0 13.9,8 A5.9,5.9 0 1,0 2.1,8 Z"/>
    <!-- 经线：两个同心椭圆挖空成环 -->
    <path fill-rule="evenodd" d="M4.8,8 A3.2,7 0 1,0 11.2,8 A3.2,7 0 1,0 4.8,8 Z M5.9,8 A2.1,5.9 0 1,0 10.1,8 A2.1,5.9 0 1,0 5.9,8 Z"/>
    <!-- 赤道（宽度按矩形四角到圆心的距离收敛，避免顶出圆外） -->
    <rect x="1.02" y="7.45" width="13.96" height="1.1"/>
    <!-- 上下两条纬线（同样按弦长收进圆内，四角不外露） -->
    <rect x="2.29" y="3.95" width="11.42" height="1.1"/>
    <rect x="2.29" y="10.95" width="11.42" height="1.1"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Web">
  <defs>
    <linearGradient id="sphere" x1="0" y1="106" x2="0" y2="406" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4DA2FF"/>
      <stop offset="1" stop-color="#1B6FE0"/>
    </linearGradient>
    <clipPath id="ball">
      <circle cx="256" cy="256" r="150"/>
    </clipPath>
  </defs>
  <!-- 仿 iPhone 🌐：蓝色球体 + 白色经纬线，球体以外透明 -->
  <circle cx="256" cy="256" r="150" fill="url(#sphere)"/>
  <g clip-path="url(#ball)" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round">
    <ellipse cx="256" cy="256" rx="70" ry="150"/>
    <line x1="106" y1="256" x2="406" y2="256"/>
    <line x1="126" y1="181" x2="386" y2="181"/>
    <line x1="126" y1="331" x2="386" y2="331"/>
  </g>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-width="18"/>
</svg>

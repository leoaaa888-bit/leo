<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Web">
  <defs>
    <linearGradient id="s" x1="0" y1="6" x2="0" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4DA2FF"/>
      <stop offset="1" stop-color="#1B6FE0"/>
    </linearGradient>
    <clipPath id="b">
      <circle cx="16" cy="16" r="10"/>
    </clipPath>
  </defs>
  <!-- 仿 iPhone 🌐：蓝球 + 白经纬线；粗描边保证 16px 下仍清晰 -->
  <circle cx="16" cy="16" r="10" fill="url(#s)"/>
  <g clip-path="url(#b)" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round">
    <ellipse cx="16" cy="16" rx="4.6" ry="10"/>
    <line x1="6" y1="16" x2="26" y2="16"/>
  </g>
  <circle cx="16" cy="16" r="10" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
</svg>

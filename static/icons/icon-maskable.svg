<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Web">
  <defs>
    <linearGradient id="sphere" x1="0" y1="132" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4DA2FF"/>
      <stop offset="1" stop-color="#1B6FE0"/>
    </linearGradient>
    <clipPath id="ball">
      <circle cx="256" cy="256" r="124"/>
    </clipPath>
  </defs>
  <!-- 仿 iPhone 🌐；图形收在中心 80% 安全区内，球体以外透明 -->
  <circle cx="256" cy="256" r="124" fill="url(#sphere)"/>
  <g clip-path="url(#ball)" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round">
    <ellipse cx="256" cy="256" rx="58" ry="124"/>
    <line x1="132" y1="256" x2="380" y2="256"/>
    <line x1="149" y1="194" x2="363" y2="194"/>
    <line x1="149" y1="318" x2="363" y2="318"/>
  </g>
  <circle cx="256" cy="256" r="124" fill="none" stroke="#FFFFFF" stroke-width="15"/>
</svg>
